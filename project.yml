# Topo.xcodeproj is generated from this file: `xcodegen generate` after editing, commit both.
name: Topo
options:
  bundleIdPrefix: zone.hexagon.topo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    tvOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4A5NSJ6Y3G
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_CFBundleDisplayName: Topo
    ENABLE_USER_SCRIPT_SANDBOXING: true
packages:
  TopoCore:
    path: Packages/TopoCore
  TopoLink:
    path: Packages/TopoLink
  TopoAuth:
    path: Packages/TopoAuth
  TopoTurn:
    path: Packages/TopoTurn
  # NVIDIA Parakeet as CoreML, with its CTC keyword spotter for the vocabulary rescoring, for
  # the phone's ear (Apps/Client/Ear.swift). Pinned exactly: the vocabulary-boosting API the
  # ear drives by hand (VocabularyBoostingSession) is not the version-stable part of the
  # package, and a floating minor could move it. The iOS app only: nothing on the wrist or the
  # television transcribes, and the models are half a gigabyte.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: "0.15.6"
  # MLX-Audio's Swift port, for the phone's voice (Apps/Client/Voice.swift): Kokoro synthesising
  # replies on the device. Pinned to a revision rather than a version range because the
  # published tags are a long way behind main and the Kokoro API the voice calls
  # (`KokoroModel`'s refAudio/language arguments, `KokoroMultilingualProcessor`) is main's. The
  # iOS app only: MLX wants a real Metal device, and nothing on the wrist or the television
  # synthesises anything.
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift
    revision: cae704f53bc32a3d0b606823828fbc5bedaaf388
  # MLXAudioTTS vends MLXArray across its own API, so the voice names the array type and the
  # safetensors loader directly. Declared rather than relied on as a transitive import, and
  # pinned exactly inside the range MLXAudio asks for (0.30.6 up to the next major), so SPM
  # resolves one copy: 0.31.4 is the last release without the CudaBuild build-tool plugin,
  # which 0.31.5 adds and which xcodebuild refuses to run unvalidated, on the CI runner
  # included.
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: "0.31.4"
targets:
  Topo:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - Apps/Shared
      - Apps/Client
      - Apps/Topo
      # What the About screen reads, rather than a copy of it in Swift.
      - path: THIRD-PARTY
        buildPhase: resources
      # Buddy's blended Kokoro style vector, which is not one of the model repo's own voices.
      - path: Apps/Topo/Resources/bm_buddy.safetensors
        buildPhase: resources
      # The pinned file list the models are downloaded from; scripts/model-manifest.sh writes it.
      - path: Apps/Topo/Resources/models.json
        buildPhase: resources
    dependencies:
      - package: TopoCore
      - package: TopoAuth
      - package: TopoTurn
      - package: FluidAudio
      - package: MLXAudio
        product: MLXAudioTTS
      - package: mlx-swift
        product: MLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo
        # FluidAudio's prebuilt text-normalisation xcframework has an arm64 simulator slice and
        # no x86_64 one, so a generic simulator build of this target is arm64 only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/Topo.entitlements
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Topo listens when you press the microphone, so it can hear what you forgot.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Topo turns what you say into text so it can answer you.
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  TopoWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/Shared
      - Apps/Client
      - Apps/TopoWatch
      - path: THIRD-PARTY
        buildPhase: resources
    dependencies:
      - package: TopoAuth
      - package: TopoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.watch
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/Topo.entitlements
        INFOPLIST_KEY_WKWatchOnly: true
        INFOPLIST_KEY_WKApplication: true
  TopoTV:
    type: application
    platform: tvOS
    sources:
      - Apps/Shared
      - Apps/Client
      - Apps/TopoTV
      - path: THIRD-PARTY
        buildPhase: resources
    dependencies:
      - package: TopoAuth
      - package: TopoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.tv
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        CODE_SIGN_ENTITLEMENTS: Apps/Topo.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: true
  # The app targets' own logic — the transcript store, the identity, the
  # views' data — tested against TopoCoreTesting's in-memory database, so no
  # test needs an account. Hosted by the iOS app; the watch and TV builds
  # share every file it covers.
  TopoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Client
      - path: THIRD-PARTY
        buildPhase: resources
    dependencies:
      - target: Topo
      - package: TopoCore
        product: TopoCoreTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.tests

  TopoHub:
    type: application
    platform: macOS
    sources:
      - Apps/Shared
      - Apps/TopoHub
      # The page a television opens, served from this bundle as it is.
      - path: Womble/Web
        buildPhase: resources
        excludes: [surface.json]
    dependencies:
      - package: TopoAuth
      - package: TopoCore
        product: TopoCore
      - package: TopoCore
        product: TopoCoreTesting
      - package: TopoLink
    # XcodeGen writes this file from these properties on every generate.
    entitlements:
      path: Apps/TopoHub/TopoHub.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        # The log's container and the board's: the hub reads both, and the
        # board is a container of its own because it is shared across the
        # household's Apple IDs and the log never is.
        com.apple.developer.icloud-container-identifiers: [iCloud.zone.hexagon.topo, iCloud.zone.hexagon.topo.board]
        com.apple.developer.icloud-services: [CloudKit]
    info:
      path: Apps/TopoHub/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Topo Hub
        NSBonjourServices: [_topo._tcp]
        NSLocalNetworkUsageDescription: Topo Hub finds your other devices on this network and answers when they check it is here.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.hub
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Topo:
    build:
      targets: { Topo: all, TopoTests: [test] }
    run: { config: Debug }
    test:
      config: Debug
      targets: [TopoTests]
  TopoWatch:
    build:
      targets: { TopoWatch: all }
  TopoTV:
    build:
      targets: { TopoTV: all }
  TopoHub:
    build:
      targets: { TopoHub: all }
