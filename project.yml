# Topo.xcodeproj is generated from this file: `xcodegen generate` after editing, commit both.
name: Topo
options:
  bundleIdPrefix: zone.hexagon.topo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    tvOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4A5NSJ6Y3G
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_CFBundleDisplayName: Topo
    ENABLE_USER_SCRIPT_SANDBOXING: true
packages:
  TopoCore:
    path: Packages/TopoCore
  TopoLink:
    path: Packages/TopoLink
  TopoAuth:
    path: Packages/TopoAuth
  TopoTurn:
    path: Packages/TopoTurn
  # The guest: the iSH kernel and emulator of OpenMinis/ish-arm64 and the Swift over them. Its
  # framework is built by scripts/build-ish.sh, which has to have run before this project
  # resolves; the iOS app only.
  TopoUserland:
    path: Packages/TopoUserland
  # The guest's two doors on the app's loopback: the relay Claude Code reaches api.anthropic.com
  # through (plain HTTP in on 127.0.0.1, TLS out), and the tool service the guest's `topo` calls
  # (TopoTools). The iOS app only.
  TopoProxy:
    path: Packages/TopoProxy
  # Topo the octopus, drawn in pixels from the agent's state, on the composer's glass. Sam's own
  # engine from samdu/experiments (topo-mascot-swift at 91139e8), unchanged. The iOS app only.
  TopoMascot:
    path: Packages/TopoMascot
  # The phone's ear and its voice: NVIDIA Parakeet as CoreML with its CTC keyword spotter for
  # the vocabulary rescoring (Apps/Client/Ear.swift), and Kyutai's Pocket TTS as CoreML
  # (Apps/Client/Voice.swift). Pinned exactly: neither the vocabulary-boosting API the ear
  # drives by hand (VocabularyBoostingSession) nor the per-stage compute units the voice sets
  # (PocketTtsComputeUnits) is the version-stable part of the package, and a floating minor
  # could move either. The iOS app only: nothing on the wrist or the television transcribes or
  # speaks, and the models are the better part of a gigabyte.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: "0.15.7"
targets:
  Topo:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - Apps/Shared
      - Apps/Client
      - Apps/Topo
      # The widgets' two intents, which the app runs and the extension names, and the provider,
      # whose entries the suites hold.
      - Apps/Widgets/WidgetIntents.swift
      - Apps/Widgets/SurfaceProvider.swift
      # What the About screen reads, rather than a copy of it in Swift.
      - path: THIRD-PARTY
        buildPhase: resources
      # The GPL's text, which the iSH fork's App Store waiver holds only while the app carries it;
      # the About screen shows it, and `scripts/check-built-plist.sh` fails a product without it.
      - path: LICENSE
        buildPhase: resources
      # The pinned file list the models are downloaded from; scripts/model-manifest.sh writes it.
      - path: Apps/Topo/Resources/models.json
        buildPhase: resources
      # The mark itself, read at launch rather than copied into Swift.
      - path: Design/topo-mark.svg
        buildPhase: resources
    dependencies:
      - package: TopoCore
      - package: TopoAuth
      - package: TopoTurn
      - package: FluidAudio
      - package: TopoUserland
      - package: TopoProxy
      - package: TopoProxy
        product: TopoTools
      - package: TopoMascot
      # The home-screen and lock-screen widgets, embedded in the app.
      - target: TopoWidgets
    # Everything else in this target's Info.plist is generated from the INFOPLIST_KEY settings
    # below, which Xcode merges into this file. `UIBackgroundModes` is not one of the keys Xcode
    # generates — an `INFOPLIST_KEY_UIBackgroundModes` setting reaches the project and no built
    # app — and a background mode the product does not declare is a process iOS suspends, so it
    # is declared here, where it lands in the bundle. A silent push wakes the primary when a limb
    # writes a turn (see TurnPush); `audio` is the reply to a spoken turn, heard behind the lock,
    # the process running while the play queue renders, which its keeper makes true from the
    # release of the press (Apps/Client/Speaker.swift). Both modes and the push entitlement
    # (`aps-environment`, in this target's own entitlements) are the iOS target's only: the watch
    # and the TV never answer and never speak.
    info:
      path: Apps/Topo/Info.plist
      properties:
        UIBackgroundModes: [remote-notification, audio]
        # The memory is an Obsidian vault, and the folder it mirrors is `<Documents>/Vault` in
        # this container. These two keys are what put that folder in Files under On My iPhone ›
        # Topo and let an editor open it in place, which is how the person reads and writes the
        # memory; neither is a key Xcode generates from a build setting, so both live here beside
        # the background modes, and `scripts/check-built-plist.sh` reads them off the product.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The version keys are the settings' to answer, not this file's: a literal here beats the
        # `CURRENT_PROJECT_VERSION` that `scripts/archive-upload.sh` passes on the command line,
        # and every TestFlight upload would carry the same build number (docs/testflight.md).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The commit this build's source is, which the About screen names as the corresponding
        # source the GPL asks for; `scripts/archive-upload.sh` passes it, and it is empty elsewhere.
        TopoSourceCommit: $(TOPO_SOURCE_COMMIT)
        # `topo://open` and `topo://cue?…`, which the widgets open (Apps/Widgets/WidgetIntents.swift).
        # No setting generates this key, so it is here, and `scripts/check-built-plist.sh` reads it.
        CFBundleURLTypes:
          - CFBundleURLName: zone.hexagon.topo
            CFBundleURLSchemes: [topo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo
        TOPO_SOURCE_COMMIT: ""
        # FluidAudio's prebuilt text-normalisation xcframework has an arm64 simulator slice and
        # no x86_64 one, so a generic simulator build of this target is arm64 only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/TopoiOS.entitlements
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Topo listens when you press the microphone, so it can hear what you forgot.
        # The phone's own tools (`topo` in the guest): each asked for by the first call that needs it,
        # never at launch. A request with no string is a crash, not a refusal, so
        # `scripts/check-built-plist.sh` reads all five off the product.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Topo reads and adds your reminders when you ask it to.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Topo reads your calendar and adds events when you ask it to.
        INFOPLIST_KEY_NSContactsUsageDescription: Topo looks people up in your contacts when you ask about them.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Topo checks where you are when you ask something that depends on it.
        INFOPLIST_KEY_NSHomeKitUsageDescription: Topo reads and controls your home's accessories when you ask it to.
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  # The mind's widgets on the home screen and the lock screen (docs/widgets.md): one kind that
  # draws a slot's document out of the app group, and nothing else — no tool service, no guest,
  # no network. Topo himself is drawn by the same engine the chat draws him with.
  TopoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Apps/Widgets
      - Apps/Shared/WidgetDocument.swift
      - Apps/Shared/WidgetNodeView.swift
      - Apps/Shared/SurfaceStore.swift
      - Apps/Shared/Theme.swift
      - Apps/Shared/OctopusMark.swift
      - path: Design/topo-mark.svg
        buildPhase: resources
    dependencies:
      - package: TopoMascot
    info:
      path: Apps/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Topo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Apps/Widgets/TopoWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.zone.hexagon.topo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.widgets
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  TopoWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/Shared
      - Apps/Client
      - Apps/TopoWatch
      # The watch widgets' intents, which the app runs when a turn control opens it, and the
      # relevance it donates below watchOS 11.
      - Apps/Widgets/WidgetIntents.swift
      - Apps/Widgets/WatchRelevance.swift
      - path: THIRD-PARTY
        buildPhase: resources
      # The mark itself, read at launch rather than copied into Swift.
      - path: Design/topo-mark.svg
        buildPhase: resources
    dependencies:
      - package: TopoAuth
      - package: TopoCore
      # The complications and the Smart Stack's cards, embedded in the watch app.
      - target: TopoWatchWidgets
    # The rest is generated from the INFOPLIST_KEY settings below. The `Surface` push wakes the
    # watch in the background to fetch the slots, which is a background mode no setting generates.
    info:
      path: Apps/TopoWatch/Info.plist
      properties:
        WKBackgroundModes: [remote-notification]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.watch
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The container, the watch's own app group (app groups do not cross devices) and the push.
        CODE_SIGN_ENTITLEMENTS: Apps/TopoWatch.entitlements
        INFOPLIST_KEY_WKWatchOnly: true
        INFOPLIST_KEY_WKApplication: true
  # The watch's complications and Smart Stack cards (docs/widgets.md, The watch): the phone's
  # reader and view built for watchOS, drawing the watch's group and fetching nothing, with no
  # CloudKit entitlement at all. Topo is drawn as the mark, since the pixel engine is iOS only.
  TopoWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Apps/Widgets
        # The phone extension's own.
        excludes: [Info.plist, TopoWidgets.entitlements]
      - Apps/Shared/WidgetDocument.swift
      - Apps/Shared/WidgetNodeView.swift
      - Apps/Shared/SurfaceStore.swift
      - Apps/Shared/Theme.swift
      - Apps/Shared/OctopusMark.swift
      - path: Design/topo-mark.svg
        buildPhase: resources
    info:
      path: Apps/TopoWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Topo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Apps/TopoWatchWidgets/TopoWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.zone.hexagon.topo.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.watch.widgets
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
  # The watch's own logic — the slots' cache and fetch, the cue drain, the watch's default — and
  # the shared reader built for watchOS, against the in-memory database. Hosted by the watch app,
  # run on a watch simulator.
  TopoWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - Tests/Watch
      - Tests/Client/WidgetDocumentTests.swift
    dependencies:
      - target: TopoWatch
      - package: TopoCore
        product: TopoCoreTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.watch.tests
  TopoTV:
    type: application
    platform: tvOS
    sources:
      - Apps/Shared
      - Apps/Client
      - Apps/TopoTV
      - path: THIRD-PARTY
        buildPhase: resources
      # The mark itself, read at launch rather than copied into Swift.
      - path: Design/topo-mark.svg
        buildPhase: resources
    dependencies:
      - package: TopoAuth
      - package: TopoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.tv
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        CODE_SIGN_ENTITLEMENTS: Apps/Topo.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: true
  # The app targets' own logic — the transcript store, the identity, the
  # views' data — tested against TopoCoreTesting's in-memory database, so no
  # test needs an account. Hosted by the iOS app; the watch and TV builds
  # share every file it covers.
  TopoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Client
      - path: THIRD-PARTY
        buildPhase: resources
    dependencies:
      - target: Topo
      - package: TopoCore
        product: TopoCoreTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.tests
  # The guest's suite: the rootfs pipeline, the kernel booted on Alpine's minirootfs
  # (TEST_RUNNER_TOPO_USERLAND_ROOTFS) with bash and its packages laid in
  # (TEST_RUNNER_TOPO_USERLAND_SHELL) and Claude Code mounted into it
  # (TEST_RUNNER_TOPO_USERLAND_CLAUDE), all from scripts/fetch-pinned.sh. Not hosted, so it runs in a
  # process of its own: the kernel is process-global, and this bundle boots it once.
  TopoUserlandTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Packages/TopoUserland/Tests/TopoUserlandTests
      - Packages/TopoUserland/Tests/Support
    dependencies:
      - package: TopoUserland
      # The `topo` script run in the booted guest against the tool service it calls.
      - package: TopoProxy
        product: TopoTools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.userlandtests
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  # The memory brake on a stale sample, in a process of its own again: its feeds put the kernel in
  # footprint mode for the life of the process, which a simulator's sampler cannot keep fresh.
  TopoUserlandBrakeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Packages/TopoUserland/Tests/TopoUserlandBrakeTests
      - Packages/TopoUserland/Tests/Support
    dependencies:
      - package: TopoUserland
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.userlandbraketests
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  # The one test that presses the microphone: an XCUITest that launches the iOS
  # app in the simulator and taps, holds and releases the button. In the Topo
  # scheme's test action, so the PR check runs it with the suite above.
  TopoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/ClientUI
      # The phrase the microphone test plays into the host's output and expects Parakeet to hear.
      - path: Tests/Fixtures
        buildPhase: resources
      # The widget documents the widget suite draws in the app's debug host.
      - path: Tests/Client/Widgets
        buildPhase: resources
        excludes: ["References/**"]
    dependencies:
      - target: Topo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.uitests
  # The spoken turn end to end: a question looped into the microphone, heard by Parakeet, sent,
  # answered by Claude and read aloud. It needs a real setup token, an iCloud account on the
  # simulator and a loopback lane, which only buddybox has, so it is in its own scheme
  # (TopoTalk, run by `scripts/simulator-run.sh --talk`) and never in the Topo scheme's test
  # action, where the PR check would fail it.
  TopoTalkTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/ClientTalk
      - path: Tests/Fixtures/capital-of-france.wav
        buildPhase: resources
    dependencies:
      - target: Topo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.talktests

  TopoHub:
    type: application
    platform: macOS
    sources:
      - Apps/Shared
      - Apps/TopoHub
      # The page a television opens, served from this bundle as it is.
      - path: Womble/Web
        buildPhase: resources
        excludes: [surface.json]
      # The mark itself, read at launch rather than copied into Swift.
      - path: Design/topo-mark.svg
        buildPhase: resources
    dependencies:
      - package: TopoAuth
      - package: TopoCore
        product: TopoCore
      - package: TopoCore
        product: TopoCoreTesting
      - package: TopoLink
    # XcodeGen writes this file from these properties on every generate.
    entitlements:
      path: Apps/TopoHub/TopoHub.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        # The log's container and the board's: the hub reads both, and the
        # board is a container of its own because it is shared across the
        # household's Apple IDs and the log never is.
        com.apple.developer.icloud-container-identifiers: [iCloud.zone.hexagon.topo, iCloud.zone.hexagon.topo.board]
        com.apple.developer.icloud-services: [CloudKit]
    info:
      path: Apps/TopoHub/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Topo Hub
        NSBonjourServices: [_topo._tcp]
        NSLocalNetworkUsageDescription: Topo Hub finds your other devices on this network and answers when they check it is here.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.hub
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Topo:
    build:
      targets: { Topo: all, TopoTests: [test], TopoUserlandTests: [test], TopoUserlandBrakeTests: [test], TopoUITests: [test] }
    run: { config: Debug }
    test:
      config: Debug
      targets: [TopoTests, TopoUserlandTests, TopoUserlandBrakeTests, TopoUITests]
  TopoTalk:
    build:
      targets: { Topo: all, TopoTalkTests: [test] }
    test:
      config: Debug
      targets: [TopoTalkTests]
  TopoWatch:
    build:
      targets: { TopoWatch: all, TopoWatchTests: [test] }
    test:
      config: Debug
      targets: [TopoWatchTests]
  TopoTV:
    build:
      targets: { TopoTV: all }
  TopoHub:
    build:
      targets: { TopoHub: all }
