# Topo.xcodeproj is generated from this file: `xcodegen generate` after editing, commit both.
name: Topo
options:
  bundleIdPrefix: zone.hexagon.topo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    tvOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4A5NSJ6Y3G
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_CFBundleDisplayName: Topo
    ENABLE_USER_SCRIPT_SANDBOXING: true
packages:
  TopoCore:
    path: Packages/TopoCore
  TopoAuth:
    path: Packages/TopoAuth
  TopoTurn:
    path: Packages/TopoTurn
targets:
  Topo:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources: [Apps/Shared, Apps/Client, Apps/Topo]
    dependencies:
      - package: TopoCore
      - package: TopoAuth
      - package: TopoTurn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/Topo.entitlements
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Topo listens when you press the microphone, so it can hear what you forgot.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Topo turns what you say into text so it can answer you.
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  TopoWatch:
    type: application
    platform: watchOS
    sources: [Apps/Shared, Apps/Client, Apps/TopoWatch]
    dependencies:
      - package: TopoAuth
      - package: TopoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/Topo.entitlements
        INFOPLIST_KEY_WKWatchOnly: true
        INFOPLIST_KEY_WKApplication: true
  TopoTV:
    type: application
    platform: tvOS
    sources: [Apps/Shared, Apps/Client, Apps/TopoTV]
    dependencies:
      - package: TopoAuth
      - package: TopoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.tv
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        CODE_SIGN_ENTITLEMENTS: Apps/Topo.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: true
  # The app targets' own logic — the transcript store, the identity, the
  # views' data — tested against TopoCoreTesting's in-memory database, so no
  # test needs an account. Hosted by the iOS app; the watch and TV builds
  # share every file it covers.
  TopoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Client]
    dependencies:
      - target: Topo
      - package: TopoCore
        product: TopoCoreTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.tests

  TopoHub:
    type: application
    platform: macOS
    sources: [Apps/Shared, Apps/TopoHub]
    dependencies:
      - package: TopoCore
      - package: TopoAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zone.hexagon.topo.hub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: Topo Hub
schemes:
  Topo:
    build:
      targets: { Topo: all, TopoTests: [test] }
    run: { config: Debug }
    test:
      config: Debug
      targets: [TopoTests]
  TopoWatch:
    build:
      targets: { TopoWatch: all }
  TopoTV:
    build:
      targets: { TopoTV: all }
  TopoHub:
    build:
      targets: { TopoHub: all }
