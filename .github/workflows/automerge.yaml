# Workflow-based auto-merge. Squash-merges a PR once the "PR validate" workflow
# has concluded green for its head commit — the Codex verdict is the gate, and
# `review_gate` is also main's required status check, so the merge cannot get
# past a red verdict by either route.
#
# The `automerge` label is required only when the repository variable
# AUTOMERGE_REQUIRE_LABEL is "true". Unset or anything else, every ready PR
# that passes review merges unattended — the fleet's label-as-authorization
# rule is one `gh variable set AUTOMERGE_REQUIRE_LABEL --body true` away.
#
# One entry point, workflow_run on PR validate completing: GitHub runs the
# default branch's copy of this file for it, so no PR can edit this job.
# Opening, reopening, a push and marking a PR ready all start PR
# validate, so its completion is when every condition can first hold. Each
# is read then, the label included: one added after a green run merges
# nothing until a push, or a re-run of this workflow's run for that head
# (`gh run rerun <id>`). A Proof box ticked after a green run is the same,
# and the janitor merges it on a later pass (docs/janitor.md, step 1). The
# script is idempotent and no-ops unless every condition holds.
#
# PR validate runs the PR's own copy of its workflow, and its review jobs run
# `scripts/review-*` and `scripts/ci-select-*` from the PR's checkout. A PR
# that changes any of those, or anything under `.github/`, wrote its own
# validation, so its green run is no evidence of tests or review: it is
# skipped, and the coordinator merges it after reading the review.
name: Auto-merge

on:
  workflow_run:
    workflows: ["PR validate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: vm-linux
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      REQUIRE_LABEL: ${{ vars.AUTOMERGE_REQUIRE_LABEL }}
    steps:
      - name: Merge when validated
        run: |
          set -euo pipefail

          # Resolve the PR the completed run was for.
          prs="$(jq -r '.workflow_run.pull_requests[]?.number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$prs" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            prs="$(gh pr list --state open --json number,headRefOid \
                    --jq ".[] | select(.headRefOid==\"$sha\") | .number")"
          fi

          [ -n "$prs" ] || { echo "No candidate PR; nothing to do."; exit 0; }

          for pr in $prs; do
            echo "::group::PR #$pr"

            info="$(gh pr view "$pr" --json state,isDraft,labels,headRefOid,baseRefName,body)"
            state="$(jq -r .state <<<"$info")"
            draft="$(jq -r .isDraft <<<"$info")"
            sha="$(jq -r .headRefOid <<<"$info")"
            base="$(jq -r .baseRefName <<<"$info")"
            labelled="$(jq -r '[.labels[].name] | index("automerge") != null' <<<"$info")"

            if [ "$state" != "OPEN" ] || [ "$draft" = "true" ] || [ "$base" != "main" ]; then
              echo "skip: state=$state draft=$draft base=$base"
              echo "::endgroup::"; continue
            fi
            # An unchecked box in the description is a claim not yet proved —
            # by convention a device test, `- [ ] device: …` or `- [ ] device(2): …`,
            # ticked by the janitor once the results on its build's issue verify
            # it, or by the coordinator (docs/process.md, Device checks). Nothing
            # unproved merges unattended.
            if jq -r .body <<<"$info" | grep -qE '^\s*[-*] \[ \]'; then
              echo "skip: the description has an unchecked box; a claim is still unproved"
              echo "::endgroup::"; continue
            fi
            if [ "$REQUIRE_LABEL" = "true" ] && [ "$labelled" != "true" ]; then
              echo "skip: AUTOMERGE_REQUIRE_LABEL is true and the PR has no automerge label"
              echo "::endgroup::"; continue
            fi

            # The files the PR changes at this head, renames' old paths
            # included. The compare lists at most 300 files, so a list that
            # long, or one that cannot be read, is refused as unwhole.
            if ! files="$(gh api "repos/$GH_REPO/compare/$base...$sha" \
                    --jq '[.files[] | .filename, (.previous_filename // empty)]')" \
               || [ "$(jq length <<<"$files")" -ge 300 ]; then
              echo "skip: could not read every file the PR changes"
              echo "::endgroup::"; continue
            fi
            if jq -e 'any(.[]; test("^(\\.github/|scripts/review-|scripts/ci-select-)"))' <<<"$files" >/dev/null; then
              echo "skip: the PR changes .github/, scripts/review-* or scripts/ci-select-*, so its own copy validated it; the coordinator merges"
              echo "::endgroup::"; continue
            fi

            # Require the latest "PR validate" run for this exact head commit to
            # have concluded success. Pick the newest run explicitly rather than
            # trusting the API's order: one sha can carry several runs (a draft
            # accumulates red runs, and `ready_for_review` adds the green one to
            # the same commit).
            run="$(gh api "repos/$GH_REPO/actions/workflows/pr-validate.yaml/runs?head_sha=$sha&event=pull_request&per_page=100" \
                    --jq '[.workflow_runs[]] | sort_by(.created_at, .id) | last | "\(.status) \(.conclusion)"' || echo "none")"
            echo "pr-validate for $sha: $run"
            if [ "$run" != "completed success" ]; then
              echo "skip: PR validate not green yet"
              echo "::endgroup::"; continue
            fi

            echo "Merging PR #$pr (squash)"
            # Pinned to the sha the green run was read for: a push landing
            # between that read and this merge must not merge code no reviewer
            # saw.
            gh pr merge "$pr" --squash --delete-branch --match-head-commit "$sha"

            echo "::endgroup::"
          done
