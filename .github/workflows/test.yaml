# The Swift suite, as a signal on the PR: it is not a required check and the
# review gate does not wait on it, so a macOS runner that never picks the job
# up cannot hold a merge. `review_gate` in pr-validate.yaml is the one gate.
name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      # Every package under Packages/ runs its suite; a tree with none has
      # nothing to test, which is a notice rather than a failure.
      - name: swift test (Packages/*)
        run: |
          set -euo pipefail
          found=0
          for manifest in Packages/*/Package.swift; do
            [ -f "$manifest" ] || continue
            found=1
            echo "::group::$(dirname "$manifest")"
            (cd "$(dirname "$manifest")" && swift test)
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then
            echo "::notice::No Packages/*/Package.swift in this tree; nothing to test."
          fi

      # Womble is an Xcode project, not a package, so it needs a simulator
      # rather than `swift test`. Its deployment target is iOS 12; the
      # simulator it runs the tests on is whatever the runner's Xcode ships,
      # which is the same arrangement as building it on a Mac by hand.
      - name: xcodebuild test (Womble)
        run: |
          set -euo pipefail
          if [ ! -d Womble/Womble.xcodeproj ]; then
            echo "::notice::No Womble/Womble.xcodeproj in this tree; nothing to test."
            exit 0
          fi
          # Whichever iPhone this runner's Xcode has. Naming one pins the
          # suite to a device the next Xcode may drop.
          udid="$(xcrun simctl list devices available --json \
                  | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator available on this runner."
            exit 1
          fi
          xcodebuild test \
            -project Womble/Womble.xcodeproj \
            -scheme Womble \
            -destination "platform=iOS Simulator,id=$udid"

      # The app targets' own suite. It is hosted by the iOS app and covers
      # the code the watch and TV builds share with the phone, so it runs on
      # an iPhone simulator whatever the runner's Xcode ships.
      - name: xcodebuild test (Topo)
        run: |
          set -euo pipefail
          if [ ! -d Topo.xcodeproj ]; then
            echo "::notice::No Topo.xcodeproj in this tree; nothing to test."
            exit 0
          fi
          udid="$(xcrun simctl list devices available --json \
                  | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator available on this runner."
            exit 1
          fi
          xcodebuild test \
            -project Topo.xcodeproj \
            -scheme Topo \
            -destination "platform=iOS Simulator,id=$udid"

      # The watch and TV builds are not covered by that suite's host, so they
      # are built for their own simulators here.
      - name: xcodebuild build (TopoWatch, TopoTV)
        run: |
          set -euo pipefail
          [ -d Topo.xcodeproj ] || exit 0
          xcodebuild build -project Topo.xcodeproj -scheme TopoWatch \
            -destination 'generic/platform=watchOS Simulator'
          xcodebuild build -project Topo.xcodeproj -scheme TopoTV \
            -destination 'generic/platform=tvOS Simulator'
