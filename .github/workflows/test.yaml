# The Swift suite, as a signal on the PR: it is not a required check and the
# review gate does not wait on it, so a macOS runner that never picks the job
# up cannot hold a merge. `review_gate` in pr-validate.yaml is the one gate.
name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      # Every package under Packages/ runs its suite; a tree with none has
      # nothing to test, which is a notice rather than a failure.
      - name: swift test (Packages/*)
        run: |
          set -euo pipefail
          found=0
          for manifest in Packages/*/Package.swift; do
            [ -f "$manifest" ] || continue
            found=1
            echo "::group::$(dirname "$manifest")"
            (cd "$(dirname "$manifest")" && swift test)
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then
            echo "::notice::No Packages/*/Package.swift in this tree; nothing to test."
          fi
