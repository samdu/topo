# The merge gate. The suite runs as parallel jobs gated by `test`; Codex
# reviews every non-draft PR whose fast jobs (`select`, `topo_unit`, `others`)
# are green, alongside the UI tests in `topo_ui`, and its verdict is what
# gates. `review_gate` and `test` are the required status checks on main, and
# automerge.yaml merges on this workflow's latest pull_request run concluding
# green — so a red suite job holds the merge by both routes, and a red fast
# job costs no reviewer round.
#
# Codex signs in with a ChatGPT-mode login rather than an API key: the
# `CODEX_AUTH_JSON` secret is the contents of a `~/.codex/auth.json` from a
# `codex login`, written into a private codex-home for the run, and the CLI
# authenticates from that file. Store it as ONE line (`jq -c . auth.json |
# gh secret set CODEX_AUTH_JSON`): the runner registers every line of a
# multi-line secret as a secret value of its own, so a pretty-printed file's
# `{` and `}` lines become values the log mask and the verdict's sanitise step
# both rewrite. Refresh it with a new `codex login` when the reviewer starts
# failing with 401s.
#
# That login is a reusable credential on a runner that also holds PR content,
# and Codex reads that content. The exposure is bounded, not removed: the
# trigger is `pull_request` (never `pull_request_target`), so a fork PR gets
# no secrets and no reviewer; the codex job runs only for branches of this
# repository; the CLI runs in its read-only sandbox, which denies its tool
# commands the network and the filesystem outside the checkout; and the login
# is deleted when the job ends. What remains — a same-repo branch carrying
# instructions that steer the reviewer — is accepted by design: a compromised
# same-repo branch already means a compromised agent with push rights.
#
# The verdict is scoped to the diff mechanically, not by prompt. The prompt
# asks Codex to review only the PR's changes, and it still blocks on defects in
# files the PR never touched. So after Codex answers, a step in the codex job
# resolves every path each finding cites (`path:line`, or a backticked path)
# against the checkout and the PR's changed-file list. A finding whose cited
# files are all real repo files and none of them changed in this PR is
# demoted: it is posted under "Pre-existing, not blocking" and does not count
# toward `blocking`; if every finding is demoted the verdict becomes
# non-blocking. A finding that cites no repo file at all keeps whatever Codex
# decided, and an answer that is not a valid verdict passes through untouched
# so review_gate's no-verdict handling still sees it.
#
# The reviewer reads a PR two ways. The first review is exhaustive: the
# prompt asks for every finding that meets the evidence rule, most serious
# first, since a defect left for a later round costs a full run. Every
# verdict post_feedback posts opens with two marker lines, the codex marker
# `<!-- agent-review: codex -->`, which the githubpr channel routes the review
# back to the session by and which never changes, and
# `<!-- agent-review-sha: <sha> -->`, the PR head that run reviewed
# (`pull_request.head.sha`, never the merge ref). A later run on the same PR
# is a re-review: scripts/review-prompt.sh finds the newest codex verdict,
# and when its SHA is an ancestor of this run's PR head, adds that verdict
# (fenced as the reviewer's own earlier output) and the PR's own commits
# between the two PR heads, each with its patch, after the description:
# commits the base also has and merge commits are left out, so a base merged
# into the branch is not shown as the fix. The re-review verifies
# each earlier finding as closed, still open or moot in `summary`, then reads
# the whole PR again; a new finding in code the diff since does not touch
# blocks only if it loses or corrupts a record, splits the primary, leaks a
# secret, or makes the description untrue at runtime. No earlier verdict, one
# with no SHA marker, or a SHA that is not an ancestor is a first review,
# said in the prompt step's log; a `gh` that still fails after its retries
# fails the step, since the review round rests on what it reads.
#
# The verdict then travels as an artifact rather than a job output. GitHub
# drops a job output wholesale when its text contains the value of any
# registered secret, so a review that happened to quote one was discarded after
# it had been paid for. The codex job sanitises the scoped verdict instead —
# every registered secret's value replaced with `***` in `summary`, `findings`
# and `demoted`, the structural fields untouched — uploads that one file as the
# `codex-verdict` artifact, and its only job output is the boolean
# `has_verdict`, which no secret's value can match. Anyone who can read the
# repository can download an artifact, so nothing unsanitised is uploaded.
# post_feedback and review_gate read that file: post_feedback is gated on
# `has_verdict`, while review_gate's guard stays `!cancelled()` and the flag
# decides only whether it downloads, so a false or absent flag still reaches
# the fail-closed checks, where a missing or unusable file is no verdict.
# scripts/tests/review-verdict-test.sh runs the sanitise and gate snippets out
# of this file and holds all of that.
name: PR validate

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is here so the ready transition starts a run at all —
    # without it, a draft marked ready sits on whatever its last draft run
    # concluded until someone pushes. It is not what skips the reviewer on
    # drafts; the `if` on the codex job does that.
    types: [opened, synchronize, reopened, ready_for_review]
  # The nightly: the full lane on main, real ear included, once a night. A
  # red one is this workflow's failed run on main; the review jobs do not run
  # outside a pull request, so its conclusion is the suite's.
  schedule:
    - cron: "17 10 * * *"
  # The same jobs by hand. `lane: full` is the nightly's body; `lane:
  # fast-benchmark` forces the fast lane, to time it on a branch whose own
  # diff selects the full one. `fail` fails one job on purpose (or, as
  # `skip`, takes the fast lane whatever `lane` says and leaves the real-ear
  # test selected with no models) to show the gate holding against it.
  workflow_dispatch:
    inputs:
      lane:
        description: Which lane to run
        type: choice
        options: [full, fast-benchmark]
        default: full
      fail:
        description: Fail one job on purpose
        type: choice
        options: [none, topo_unit, topo_ui, others, skip]
        default: none

# One run per PR: a superseded push should not keep burning a reviewer. A run
# outside a pull request is its own group.
concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The status pane's review feed. Best-effort: a pane that is down must not
  # redden a review.
  #
  # The pane lives on the tailnet now — it has no public route at all — so the two
  # jobs that post here join the tailnet first, as an ephemeral node that goes away
  # with the runner. Without TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET the join step is
  # skipped and the POST simply fails into its own warning, which is the same
  # best-effort behaviour as a pane that is down.
  STATUS_PANE_URL: https://pane.burmese-egret.ts.net/topo-status/api/review
  # The suite's toolchain, read by .github/actions/prepare. The XcodeGen
  # version is the one the committed projects are generated with locally, and
  # the release zip is checked against its hash so a replaced asset fails.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  RESULTS: ${{ github.workspace }}/ci-results
  # The one test only the full lane runs: Parakeet hearing the fixture.
  REAL_EAR_TEST: TopoUITests/MicrophonePressTests/testParakeetHearsTheFixtureThroughTheMicrophone

jobs:
  # Which lane this run takes, and why, said in its log and its summary.
  #
  #   pull_request       the paths the PR changes against main: `full` when any
  #                      is on the voice path below or when the diff cannot be
  #                      read, `fast` otherwise (scripts/ci-select-lane.sh,
  #                      whose test reads this list and runs this step).
  #   schedule           `full`: the nightly run on main.
  #   workflow_dispatch  the `lane` input: `full` by default, which is the
  #                      nightly's body run by hand, or `fast-benchmark`, which
  #                      forces the fast lane on the same jobs to time it.
  #
  # The two lanes differ in one job, `topo_ui`, and in one thing: the full lane
  # fetches Parakeet's models and runs the UI test in which the real ear hears
  # the fixture through the microphone; the fast lane deselects that test by
  # name. Everything else — the audio loopback, the press tests over the stub
  # and loading ears, every other suite — runs in both.
  #
  # The PR's own changes are `HEAD^1..HEAD` of GitHub's test merge commit,
  # whose first parent is main: what merging the PR would change on main.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      reason: ${{ steps.lane.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Choose the lane
        id: lane
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_LANE: ${{ inputs.lane }}
          DISPATCH_FAIL: ${{ inputs.fail }}
          # The voice path: a change to any of these runs the real ear on its
          # PR. One bash glob per line; `*` crosses `/`.
          VOICE_PATHS: |
            Apps/Client/AudioSession.swift
            Apps/Client/ChatView.swift
            Apps/Client/Composer.swift
            Apps/Client/DebugRun.swift
            Apps/Client/Ear.swift
            Apps/Client/ModelDownloads.swift
            Apps/Client/ModelHousekeeping.swift
            Apps/Client/Vocabulary.swift
            Apps/Client/VoiceInput.swift
            Apps/Topo/Resources/models.json
            Tests/ClientUI/*
            Tests/Fixtures/*
            Topo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            project.yml
            scripts/ci-audio-feeder.swift
            scripts/ci-audio-lane.sh
            scripts/ci-audio-meter.swift
            scripts/ci-require-tests.sh
            scripts/ci-select-lane.sh
            scripts/fetch-ear-models.sh
            .github/actions/prepare/*
            .github/workflows/pr-validate.yaml
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              # A diff that cannot be read selects full, inside the script.
              scripts/ci-select-lane.sh --git HEAD^1 HEAD > "$RUNNER_TEMP/lane.txt"
              ;;
            schedule)
              printf 'lane=full\nreason=the nightly run on main\n' > "$RUNNER_TEMP/lane.txt"
              ;;
            workflow_dispatch)
              # `fail=skip` is the fast lane's model-less setup with the real-ear
              # test left selected, so it takes the fast lane whatever `lane` says.
              if [ "$DISPATCH_FAIL" = skip ]; then
                printf 'lane=fast\nreason=workflow_dispatch fail=skip overrode lane=%s: the fast lane with no models and the real-ear test left selected, a deliberate failure\n' "$DISPATCH_LANE" > "$RUNNER_TEMP/lane.txt"
              else
                case "$DISPATCH_LANE" in
                  full) printf 'lane=full\nreason=workflow_dispatch asked for the full lane\n' > "$RUNNER_TEMP/lane.txt" ;;
                  fast-benchmark) printf 'lane=fast\nreason=workflow_dispatch forced the fast lane: a benchmark run, not a selection\n' > "$RUNNER_TEMP/lane.txt" ;;
                  *) echo "::error::Unknown lane input '$DISPATCH_LANE'."; exit 1 ;;
                esac
              fi
              ;;
            *)
              echo "::error::No lane rule for the $EVENT event."; exit 1
              ;;
          esac
          cat "$RUNNER_TEMP/lane.txt" >> "$GITHUB_OUTPUT"
          lane="$(sed -n 's/^lane=//p' "$RUNNER_TEMP/lane.txt")"
          reason="$(sed -n 's/^reason=//p' "$RUNNER_TEMP/lane.txt")"
          echo "::notice title=Lane: $lane::$reason"
          echo "**Lane: $lane** — $reason" >> "$GITHUB_STEP_SUMMARY"

  # The suite is three macOS jobs that run at once — `topo_unit`, `topo_ui`
  # and `others` — and `test` below is the gate over them and the select job.
  # Concurrency cost: three of the five macOS jobs the free plan runs at a
  # time across the account, so a second PR validating at once gets two
  # runners straight away and queues its third for a few minutes, rather than
  # queueing whole. Two jobs would leave the Topo scheme's suite on one runner,
  # which is today's time (about 22–25 minutes), and in-job parallel testing
  # over simulator clones starves a runner of this size (three clones never
  # launched; two ran past the fast lane's budget). What can run on
  # ubuntu-latest (the lane choice, the gate) runs there and does not count.
  #
  # Green means the named suites ran, not that nothing complained: every
  # package and project is named and a missing one fails, and
  # scripts/ci-require-tests.sh reads each result — xcresult bundles per test
  # target, Swift Testing's xunit report per package — and fails on a target
  # that did not run, a suite with no tests, a failure or a skip. Within a job
  # each suite step runs after an earlier one failed (`!cancelled()`), so one
  # red run reports every suite, and the logs and result bundles are uploaded
  # however the job ends, one artifact per job.
  #
  # The Topo scheme's test action is split two ways by test selection, never
  # by leaving a suite's inputs out and letting it skip: `topo_ui` runs the UI
  # tests, and `topo_unit` runs everything else, so a suite added to TopoTests
  # lands in `topo_unit` without anyone naming it.
  #
  # `fail` is a workflow_dispatch input that fails one job on purpose, as its
  # last step, so the gate can be shown holding against each prerequisite.

  # The app targets' own suite (TopoTests), hosted by the iOS app and covering
  # the code the watch and TV builds share with the phone, and the userland
  # package's two bundles.
  topo_unit:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          guest: "true"

      # Alpine's minirootfs, bash and its packages, and Claude Code, fetched from
      # the manifest's entries and verified by digest, for the userland suites to
      # import, boot and run.
      - name: The rootfs, bash and Claude Code for the userland suites
        run: |
          set -euo pipefail
          rootfs="$(scripts/fetch-pinned.sh alpine-minirootfs "$HOME/rootfs")"
          echo "TEST_RUNNER_TOPO_USERLAND_ROOTFS=$rootfs" >> "$GITHUB_ENV"
          shell="$(scripts/fetch-pinned.sh alpine-bash "$HOME/alpine-bash")"
          echo "TEST_RUNNER_TOPO_USERLAND_SHELL=$shell" >> "$GITHUB_ENV"
          claude="$(scripts/fetch-pinned.sh claude-code "$HOME/claude-code")"
          echo "TEST_RUNNER_TOPO_USERLAND_CLAUDE=$claude" >> "$GITHUB_ENV"

      # Booted while the build runs, so the suite does not wait on it.
      - name: Boot the simulator
        run: xcrun simctl boot "$SIMULATOR_UDID"

      - name: xcodebuild build-for-testing (Topo)
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project Topo.xcodeproj -scheme Topo \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            2>&1 | tee "$RESULTS/Topo-unit-build.log"

      - name: xcodebuild test (Topo, unit and userland)
        # The cooperative pool pinned to one thread in the test runner, as for
        # the package suites below: the guest's pipes and waits block, and a
        # block that lands on the pool hangs here rather than on a phone.
        env:
          TEST_RUNNER_LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b >/dev/null
          xcodebuild test-without-building \
            -project Topo.xcodeproj -scheme Topo \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -skip-testing:TopoUITests \
            -resultBundlePath "$RESULTS/Topo-unit.xcresult" \
            2>&1 | tee "$RESULTS/Topo-unit.log"

      # The exit codes above say nothing about a target the scheme dropped;
      # this reads what actually ran. It also runs after a failed test step,
      # where a missing result bundle is reported as such.
      - name: Require every test target ran and passed
        if: ${{ !cancelled() }}
        run: scripts/ci-require-tests.sh xcresult "$RESULTS/Topo-unit.xcresult" TopoTests TopoUserlandTests TopoUserlandBrakeTests

      - name: Deliberate failure (workflow_dispatch fail=topo_unit)
        if: ${{ !cancelled() && inputs.fail == 'topo_unit' }}
        run: echo "::error::Failed on purpose by the workflow_dispatch input fail=topo_unit."; exit 1

      - name: Upload logs and result bundles
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: topo-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results
          retention-days: 7
          if-no-files-found: warn

  # The UI tests (TopoUITests), behind the input-capable audio lane on every
  # lane. The press tests over the stub and loading ears need no model, but
  # `MicrophonePressTests` asserts buffers and samples
  # reached the tap, which only a host with an input delivers. The full lane
  # adds Parakeet's models and the test in which the real ear hears the
  # fixture; the fast lane deselects that test by name, so it neither runs nor
  # skips.
  topo_ui:
    needs: select
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      LANE: ${{ needs.select.outputs.lane }}
      LANE_REASON: ${{ needs.select.outputs.reason }}
    steps:
      - name: Lane
        run: |
          set -euo pipefail
          echo "Lane: $LANE — $LANE_REASON"
          case "$LANE" in
            full | fast) ;;
            *) echo "::error::No lane from the select job ('$LANE')."; exit 1 ;;
          esac

      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          guest: "true"

      # The microphone test's input-capable lane: BlackHole as the runner
      # Mac's default input and output, and the fixture looping into it from
      # one long-lived feeder that listens to BlackHole itself and restarts on
      # silence (scripts/ci-audio-lane.sh). The simulator's microphone is the
      # host's default input; its own output does not reach the loopback.
      # TEST_RUNNER_TOPO_UITEST_AUDIO_INPUT=1 declares the lane to the test
      # runner, which then fails a hold refused for want of an input. It starts
      # before the simulator boots, because a simulator's audio binds to the
      # coreaudiod it booted against and the lane restarts coreaudiod.
      - name: Audio loopback for the microphone test
        id: audio_lane
        run: |
          set -euo pipefail
          scripts/ci-audio-lane.sh start
          echo "TEST_RUNNER_TOPO_UITEST_AUDIO_INPUT=1" >> "$GITHUB_ENV"

      # Booted while the build runs, so the suite does not wait on it.
      - name: Boot the simulator
        run: xcrun simctl boot "$SIMULATOR_UDID"

      # Parakeet's models, for the UI test in which the real recogniser hears
      # the fixture through the microphone: fetched from the manifest's pinned
      # revisions and verified file by file, cached on the manifest's hash.
      # The full lane only.
      - name: Cache the ear's models
        if: ${{ env.LANE == 'full' }}
        uses: actions/cache@v4
        with:
          path: ~/ear-models
          key: ear-models-${{ hashFiles('Apps/Topo/Resources/models.json') }}
      - name: The ear's models for the microphone test
        if: ${{ env.LANE == 'full' }}
        run: |
          set -euo pipefail
          scripts/fetch-ear-models.sh "$HOME/ear-models"
          echo "TEST_RUNNER_TOPO_UITEST_EAR_MODELS=$HOME/ear-models" >> "$GITHUB_ENV"

      - name: xcodebuild build-for-testing (Topo)
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project Topo.xcodeproj -scheme Topo \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            2>&1 | tee "$RESULTS/Topo-ui-build.log"

      # The microphone test counts the permission prompts the run raises, and
      # holds that there is exactly one and that it is the microphone's. That
      # count is only exact on a simulator that has answered nothing, so the
      # app's grants are cleared first and the flag tells the test so: without
      # it the test would take a reset that silently did not happen for a
      # permission that was never asked for.
      - name: Clear Topo's privacy grants on the simulator
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b >/dev/null
          xcrun simctl privacy "$SIMULATOR_UDID" reset all zone.hexagon.topo
          echo "TEST_RUNNER_TOPO_UITEST_PRIVACY_RESET=1" >> "$GITHUB_ENV"

      # A lane that has died fails here by name, before and after the suite,
      # rather than only as a silent tap inside the microphone test.
      - name: Audio lane holds before the microphone test
        if: ${{ steps.audio_lane.outcome == 'success' }}
        run: scripts/ci-audio-lane.sh check before

      # `fail=skip` is the defect the gate exists for: the fast lane leaving
      # the real-ear test selected with no models, where it ends in XCTSkip,
      # which scripts/ci-require-tests.sh must fail.
      - name: xcodebuild test (Topo, UI)
        env:
          DELIBERATE_SKIP: ${{ inputs.fail == 'skip' }}
        run: |
          set -euo pipefail
          select=(-only-testing:TopoUITests)
          if [ "$LANE" = fast ]; then
            if [ "$DELIBERATE_SKIP" = true ]; then
              echo "::warning::workflow_dispatch fail=skip: the real-ear test stays selected with no models, so it skips."
            else
              select+=("-skip-testing:$REAL_EAR_TEST")
              echo "Fast lane: $REAL_EAR_TEST is deselected."
            fi
          fi
          xcodebuild test-without-building \
            -project Topo.xcodeproj -scheme Topo \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            "${select[@]}" \
            -resultBundlePath "$RESULTS/Topo-ui.xcresult" \
            2>&1 | tee "$RESULTS/Topo-ui.log"

      - name: Audio lane holds after the microphone test
        if: ${{ always() && steps.audio_lane.outcome == 'success' }}
        run: scripts/ci-audio-lane.sh check after

      # The target as a whole; and on the full lane the real-ear test by
      # name: the target check counts test cases, and a lane that meant to run
      # Parakeet and did not would still pass it.
      - name: Require every test target ran and passed
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          scripts/ci-require-tests.sh xcresult "$RESULTS/Topo-ui.xcresult" TopoUITests || status=1
          if [ "$LANE" = full ]; then
            scripts/ci-require-tests.sh named "$RESULTS/Topo-ui.xcresult" "$REAL_EAR_TEST" || status=1
          fi
          exit "$status"

      - name: Deliberate failure (workflow_dispatch fail=topo_ui)
        if: ${{ !cancelled() && inputs.fail == 'topo_ui' }}
        run: echo "::error::Failed on purpose by the workflow_dispatch input fail=topo_ui."; exit 1

      - name: Upload logs and result bundles
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: topo-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results
          retention-days: 7
          if-no-files-found: warn

  # Everything that is not the Topo scheme's suite: the scripts' own tests,
  # the Swift packages, Womble, and the builds no suite hosts — the watch and
  # TV for their own simulators, a Release build for iOS devices, and the hub.
  others:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          guest: "true"

      # scripts/simulator-run.sh against a fake xcrun: every failed run exits non-zero.
      - name: simulator-run.sh fails closed
        if: ${{ !cancelled() }}
        run: scripts/tests/simulator-run-test.sh

      # This workflow's own sanitise and gate snippets against fake verdicts and
      # a fake secret: no secret value survives into the uploaded file, and no
      # missing file reads as a pass.
      - name: The review verdict sanitises and fails closed
        if: ${{ !cancelled() }}
        run: scripts/tests/review-verdict-test.sh

      # The lane selection against this workflow's own voice path: a change
      # outside it selects fast, a change to each entry selects full.
      - name: The lane selection reads the voice path
        if: ${{ !cancelled() }}
        run: scripts/tests/ci-select-lane-test.sh

      # This workflow's gate against its own job list: every suite job is a
      # prerequisite of `test` and `codex` and is read by `reviewer_ran` and
      # `review_gate`, and a red one fails the gate snippets.
      - name: Every suite job gates the reviewer and the merge
        if: ${{ !cancelled() }}
        run: scripts/tests/suite-gate-test.sh

      # ci-require-tests.sh's xcresult and named modes against a fake
      # xcresulttool: a skip fails both, and a test that did not run fails
      # `named`.
      - name: ci-require-tests.sh fails a skip and a test that did not run
        if: ${{ !cancelled() }}
        run: scripts/tests/ci-require-tests-test.sh

      # scripts/build-ish.sh's refusals: a checkout that is not the pin, a
      # patch that does not apply, a populated deps/linux, and options that are
      # not arm64/ish/asbestos each fail.
      - name: build-ish.sh refuses what it should
        if: ${{ !cancelled() }}
        run: scripts/tests/build-ish-test.sh

      # The guest's Alpine packages checked closed against hand-written indexes:
      # a dependency the pinned set does not meet at its version fails, naming
      # the package and the requirement.
      - name: model-manifest.sh holds the packages' dependencies to their versions
        if: ${{ !cancelled() }}
        run: scripts/tests/model-manifest-test.sh

      # The committed manifest is what scripts/model-manifest.sh writes from its
      # pins today: every file fetched and hashed (cached here on the script and
      # the manifest), every package checked against Alpine's index and closed.
      # A hand edit of models.json, or a pin the script and the manifest
      # disagree on, fails here.
      - name: Cache the manifest's files
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: build/models
          key: manifest-files-${{ hashFiles('scripts/model-manifest.sh', 'Apps/Topo/Resources/models.json') }}
      - name: The manifest is the script's
        if: ${{ !cancelled() }}
        run: scripts/model-manifest.sh --check

      # scripts/review-prompt.sh against a fake gh and a scratch repository,
      # fed the comment post_feedback itself posts: a first review whenever
      # the previous one is missing or unusable, and otherwise that verdict
      # verbatim with exactly the PR head's diff since it.
      - name: The review prompt carries the previous verdict and the diff since
        if: ${{ !cancelled() }}
        run: scripts/tests/review-prompt-test.sh

      # Named, not globbed: a package that disappears fails here instead of
      # leaving the loop with one fewer iteration. Every package runs even
      # after one fails, so the log shows them all.
      - name: swift test (TopoAuth, TopoCore, TopoLink, TopoMascot, TopoProxy, TopoTurn)
        if: ${{ !cancelled() }}
        # The cooperative pool is pinned to one thread. A task's thread is one of
        # a handful the whole process shares, so anything that blocks one — a
        # coordinated file access waiting out another app, a semaphore — stops
        # every other task too, and on a runner or a phone there are few threads
        # to spare. Pinned, that is a suite that hangs rather than one that is
        # slow on a laptop with cores to hide it; the step's own bound turns the
        # hang into a failure with a log, minutes in rather than at the job's cap.
        timeout-minutes: 10
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: |
          set -euo pipefail
          status=0
          for package in TopoAuth TopoCore TopoLink TopoMascot TopoProxy TopoTurn; do
            echo "::group::$package"
            if [ ! -f "Packages/$package/Package.swift" ]; then
              echo "::error::Packages/$package/Package.swift is missing."
              status=1
            elif ! swift test --package-path "Packages/$package" \
                   --xunit-output "$RESULTS/$package.xml" 2>&1 | tee "$RESULTS/$package.log"; then
              echo "::error::swift test failed in $package."
              status=1
            elif ! scripts/ci-require-tests.sh xunit "$RESULTS/$package-swift-testing.xml"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      # Womble is an Xcode project, not a package, so it needs a simulator
      # rather than `swift test`. Its deployment target is iOS 12.
      - name: xcodebuild test (Womble)
        if: ${{ !cancelled() && env.SIMULATOR_UDID != '' }}
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Womble/Womble.xcodeproj \
            -scheme Womble \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$RESULTS/Womble.xcresult" \
            2>&1 | tee "$RESULTS/Womble.log"

      - name: Require Womble's tests ran and passed
        if: ${{ !cancelled() }}
        run: scripts/ci-require-tests.sh xcresult "$RESULTS/Womble.xcresult" WombleTests

      # The watch and TV builds are not covered by the suite's host, so they
      # are built for their own simulators here.
      - name: xcodebuild build (TopoWatch, TopoTV)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          xcodebuild build -project Topo.xcodeproj -scheme TopoWatch \
            -destination 'generic/platform=watchOS Simulator' \
            2>&1 | tee "$RESULTS/TopoWatch-build.log"
          xcodebuild build -project Topo.xcodeproj -scheme TopoTV \
            -destination 'generic/platform=tvOS Simulator' \
            2>&1 | tee "$RESULTS/TopoTV-build.log"

      # Compilation only, with signing off. The simulator builds never compile
      # code excluded from the simulator — the Pocket engine and its model
      # calls in Apps/Client/Voice.swift sit behind
      # `!targetEnvironment(simulator)` — and nothing else builds TopoHub, which
      # has no test target. A Release build for any iOS device and a macOS
      # build of the hub catch compile and link errors in both. They do not
      # prove the code runs on a GPU or a device, and they do not prove
      # distribution signing: no certificate, profile or entitlement is
      # checked with CODE_SIGNING_ALLOWED=NO.
      - name: xcodebuild build (Topo Release for iOS devices, TopoHub), unsigned
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Both build even when the first fails, so one run reports both.
          status=0
          xcodebuild build -project Topo.xcodeproj -scheme Topo \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=999 \
            2>&1 | tee "$RESULTS/Topo-iOS-Release-build.log" \
            || { echo "::error::Topo Release for iOS devices failed to build."; status=1; }
          # The device build is the one product this check has, so the Info.plist is
          # read off it: a background mode declared where Xcode drops it is a
          # process iOS suspends, and a version key a build setting cannot reach
          # is every TestFlight upload carrying the same build number. The build
          # above is given 999, the way archive-upload.sh gives it a real one.
          scripts/check-built-plist.sh build/device/Build/Products/Release-iphoneos/Topo.app 999 \
            || { echo "::error::The built app's Info.plist is wrong."; status=1; }
          xcodebuild build -project Topo.xcodeproj -scheme TopoHub \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RESULTS/TopoHub-build.log" \
            || { echo "::error::TopoHub failed to build."; status=1; }
          exit "$status"

      - name: Deliberate failure (workflow_dispatch fail=others)
        if: ${{ !cancelled() && inputs.fail == 'others' }}
        run: echo "::error::Failed on purpose by the workflow_dispatch input fail=others."; exit 1

      - name: Upload logs and result bundles
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: others-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results
          retention-days: 7
          if-no-files-found: warn

  # The gate over the suite, and the required status check on main that holds
  # a red suite out. On a completed run it is green only when every suite job
  # concluded `success`, and it names each that did not. A cancelled run skips
  # it (`!cancelled()`) and concludes cancelled, and automerge merges only on
  # the latest pull_request run concluding `completed success`.
  # A macOS runner that never picks a job up therefore holds the merge —
  # deliberately, because a reviewer round spent on a build that does not
  # compile is a round wasted, and a merge waved through on a red suite is
  # worse than a late one. SUITE_RESULTS names every job in `needs` and
  # scripts/tests/suite-gate-test.sh holds that the two lists agree.
  test:
    needs: [select, topo_unit, topo_ui, others]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite job passed
        env:
          SUITE_RESULTS: >-
            select=${{ needs.select.result }}
            topo_unit=${{ needs.topo_unit.result }}
            topo_ui=${{ needs.topo_ui.result }}
            others=${{ needs.others.result }}
        run: |
          set -euo pipefail
          status=0
          for pair in $SUITE_RESULTS; do
            job="${pair%%=*}"; result="${pair#*=}"
            if [ "$result" = success ]; then
              echo "$job: success"
            else
              echo "::error::$job did not pass (result: ${result:-none})."
              status=1
            fi
          done
          exit "$status"

  # Codex runs the CLI in the runner with the repo checked out, so unlike a
  # single-shot reviewer it can open the file the diff only mentions. Its
  # verdict is a step exit code in review_gate below, which is what makes it a
  # gate rather than a comment.
  #
  # Skipped while the PR is a draft: an agent opens the PR as a draft, iterates
  # against the free local reviewer, and marks it ready — that transition is
  # what first spends a Codex round.
  #
  # It waits on the fast jobs only, never on `topo_ui` or `test`: the UI tests
  # take most of a run's wall clock, and the verdict arrives while they are
  # still going. The merge still needs both, since reviewer_ran and
  # review_gate read every suite job and `test`.
  codex:
    needs: [select, topo_unit, others]
    # Same-repo branches only: a fork PR carries untrusted content and must
    # never meet the login. (A fork PR then has no verdict, reviewer_ran goes
    # red, and it stays a human merge.)
    #
    # Every `needs.<job>.result` is spelled out because a job with its own
    # `if:` drops the implicit `success()` over its `needs` — without them, a
    # red fast job would still spend a reviewer round.
    if: >-
      needs.select.result == 'success' &&
      needs.topo_unit.result == 'success' &&
      needs.others.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Read-only, for the PR's changed-file list in the scoping step.
      pull-requests: read
      # Read-only, for the previous Codex verdict the prompt step reads.
      issues: read
    outputs:
      has_verdict: ${{ steps.sanitise.outputs.has_verdict }}
    steps:
      - name: Join the tailnet, to reach the status pane
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' }}
        # Best-effort like the POST it enables: a Tailscale outage or an expired
        # OAuth client must not fail `codex` or the required `review_gate` and hold
        # a mergeable PR. Without this the status feed becomes a merge dependency.
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}

      - name: Tell the status pane the review is running
        env:
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          jq -nc --argjson pr "$PR" --arg branch "$BRANCH" --arg ts "$(date -u +%FT%TZ)" \
            '{pr: $pr, branch: $branch, state: "running", summary: "Codex review running", ts: $ts}' \
            | curl -sS -m 10 -X POST -H 'content-type: application/json' --data-binary @- "$STATUS_PANE_URL" \
            || echo "::warning::status pane unreachable"

      # This job holds read permissions and nothing more: the persisted token
      # is repo-scoped and cannot push, comment or merge. The job that comments
      # is a separate one, with no checkout.
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      # The merge ref moves with every push, while the verdict's second marker
      # records the event's head. A push landing between the event and the
      # checkout would have the reviewer read one commit and the verdict name
      # another, and the next re-review diff from the wrong boundary, so the
      # merge ref's second parent must be the event's head or nothing is
      # reviewed (the newer push's own run reviews it). The parent is read
      # from the raw commit, since the shallow checkout grafts HEAD parentless.
      # scripts/tests/review-prompt-test.sh runs this step out of this file.
      - name: The checkout is the event's head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merged="$(git cat-file -p HEAD | sed -n 's/^parent //p' | sed -n 2p)"
          if [ "$merged" != "$HEAD_SHA" ]; then
            echo "::error::The merge ref merges ${merged:-no second parent}, not this event's PR head $HEAD_SHA: a newer push moved it. This run reviews nothing; the newer push's run reviews that."
            exit 1
          fi
          echo "The merge ref merges the event's PR head, $HEAD_SHA."

      - name: Pre-fetch base and head refs for the PR
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      # The prompt, assembled by scripts/review-prompt.sh before the login is
      # on disk: the instructions below, the PR description, and — when this
      # PR has an earlier Codex verdict naming the head it read — that verdict
      # and the PR's own commits from that head to this run's PR head, with
      # the instruction to verify each earlier finding and then read the
      # whole PR again. Anything missing or unusable there is a first review,
      # said in this step's log; a `gh` that cannot read the PR's comments
      # after its retries fails the step, so the job errors and is re-run
      # rather than reviewing under a guessed round.
      # scripts/tests/review-prompt-test.sh holds it.
      - name: Assemble the review prompt
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The PR head this run reviews, never the merge ref the checkout is on.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The base the PR merges into: its commits are not the fix's.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PROMPT: |
            Review PR #${{ github.event.pull_request.number }} in this
            repository. Review ONLY the changes it introduces.

            Be exhaustive. This is the one read the PR gets before it merges:
            report every finding that meets the evidence rule below, not the
            first few, ranked most serious first with the blocking ones
            first. A defect left for a later round costs a full CI run and a
            fix round to find.

            The question you answer is: does the code do what the PR
            description says it does, and does the evidence it claims hold?
            Read the project's CLAUDE.md for general context, and read
            docs/design.md for invariants the diff will not spell out.

            Attack the description's claims. For each thing it says was done,
            find the input, state or ordering that makes the code not do it;
            for each thing its Proof section says was verified, check that the
            test actually fails when the behaviour is wrong. A test that
            cannot fail is a finding. A claim with no test behind it is a
            finding.

            Evidence rule: every finding cites `path:line` and names the
            concrete input or sequence that breaks the claim. A finding with
            neither is reported as low-confidence — say so in its text — and
            never blocks.

            The unit, package and script suites have already passed and the
            UI tests are running beside you; this runner has no Swift
            toolchain and your sandbox is read-only; do not try to build or run
            anything — review the tests by reading them. You can read any file
            in the checkout; do that rather than guessing. Skip style and
            formatting; report only what would actually break something, and
            say plainly if you find nothing.

            Review the diff, not the repository. A defect in a file the PR
            does not touch is not this PR's to fix: mention it in `summary`
            as pre-existing, never as a blocking finding. In particular the
            workflows under `.github/workflows/` run PR-authored code with a
            reviewer credential and a write token for same-repository
            branches; that exposure is accepted by design, documented in this
            file's header, and is not a finding on any PR that does not
            change those workflows.

            Return JSON matching the schema. Set `blocking` true only for a
            finding that meets the evidence rule and would break at runtime,
            make the description untrue, lose or corrupt a record, split the
            primary, leak a secret, or ship code the licence forbids.
            `summary` is what a reader sees; `findings` is one string per
            issue.

            If you cannot complete the review — the checkout is unreadable,
            the diff will not load, anything that stops you reading — set
            `blocking` true and say why in `summary`. A review you could not
            do is not a clean review. A build or test command the sandbox
            refuses is not that: you review by reading, and every file you
            need is in the checkout.

        run: |
          set -euo pipefail
          scripts/review-prompt.sh > "$RUNNER_TEMP/prompt.txt"
          if grep -q '^----- PREVIOUS REVIEW AND THE CHANGE SINCE -----$' "$RUNNER_TEMP/prompt.txt"; then
            echo "The prompt carries the previous-review section."
          else
            echo "The prompt carries no previous-review section: a first review."
          fi

      - name: Write the Codex login
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::CODEX_AUTH_JSON secret is unset; the reviewer has no login."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/codex-home"
          chmod 700 "$RUNNER_TEMP/codex-home"
          printf '%s' "$CODEX_AUTH_JSON" > "$RUNNER_TEMP/codex-home/auth.json"
          chmod 600 "$RUNNER_TEMP/codex-home/auth.json"
          jq -e '.auth_mode == "chatgpt" and (.tokens.access_token | type) == "string"' \
            "$RUNNER_TEMP/codex-home/auth.json" >/dev/null \
            || { echo "::error::CODEX_AUTH_JSON is not a chatgpt-mode codex auth.json."; exit 1; }

      # The Codex CLI directly rather than openai/codex-action: the action
      # unconditionally waits on the Responses proxy its API-key path starts,
      # so it cannot run on a ChatGPT login. `codex exec` reads the login from
      # $CODEX_HOME/auth.json on its own.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Codex CLI
        run: npm install -g @openai/codex && codex --version

      # The CLI's read-only sandbox is bubblewrap, and Ubuntu 24.04 runners
      # block unprivileged user namespaces via AppArmor (bwrap fails with
      # `loopback: Failed RTM_NEWADDR: Operation not permitted`). Same fix
      # openai/codex-action applies on hosted Linux runners.
      - name: Enable user namespaces for the Codex sandbox
        run: |
          set -euo pipefail
          if [ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo 1)" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Codex
        id: run_codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_MODEL: gpt-6-sol
          # A verdict the workflow can act on. Free prose can only be posted;
          # a schema makes "does this block the merge" a field.
          OUTPUT_SCHEMA: |
            {"type": "object", "additionalProperties": false, "properties": {"blocking": {"type": "boolean"}, "summary": {"type": "string"}, "findings": {"type": "array", "items": {"type": "string"}}}, "required": ["blocking", "summary", "findings"]}
        run: |
          set -euo pipefail
          printf '%s' "$OUTPUT_SCHEMA" > "$RUNNER_TEMP/schema.json"
          # read-only: the reviewer's tool commands get no network and no
          # writes, so a prompt-injected `curl` of the login has nowhere to go.
          # The model call itself is made by the codex process, outside the
          # sandbox.
          codex exec < "$RUNNER_TEMP/prompt.txt" \
            --model "$CODEX_MODEL" \
            --sandbox read-only \
            --skip-git-repo-check \
            --color never \
            --output-schema "$RUNNER_TEMP/schema.json" \
            --output-last-message "$RUNNER_TEMP/verdict.json" \
            -

      # The diff-scope rule from the header. Writes `scoped.json`, which the
      # sanitise step below is the only reader of: a valid verdict leaves here
      # with its findings split into `findings` (kept) and `demoted` (cite only
      # unchanged files), plus `codex_blocking` recording what Codex itself
      # said; anything that is not a valid verdict leaves here verbatim.
      - name: Scope the verdict to the diff
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERDICT_PATH: ${{ runner.temp }}/verdict.json
        run: |
          set -euo pipefail
          # Renames list under their new name; the old name counts as changed
          # too so a finding citing either spelling stays in scope.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          echo "Changed files:"; sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          git ls-files -z > "$RUNNER_TEMP/repo-files.txt"
          python3 - "$VERDICT_PATH" "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/repo-files.txt" > "$RUNNER_TEMP/scoped.json" <<'PY'
          import json, re, sys

          verdict_path, changed_path, repo_path = sys.argv[1:4]
          raw = open(verdict_path).read()
          try:
              v = json.loads(raw)
              ok = (isinstance(v, dict) and isinstance(v.get("blocking"), bool)
                    and isinstance(v.get("summary"), str) and isinstance(v.get("findings"), list)
                    and all(isinstance(f, str) for f in v["findings"]))
          except ValueError:
              ok = False
          if not ok:
              print("verdict is not a valid {blocking, summary, findings}; passing it through unscoped", file=sys.stderr)
              sys.stdout.write(raw)
              sys.exit(0)

          changed = {l.strip() for l in open(changed_path) if l.strip()}
          repo = {p for p in open(repo_path).read().split("\0") if p}

          # A cite is `path:line` anywhere, or anything in backticks. Both are
          # only candidates: one that does not resolve to a file in the checkout
          # (a symbol, an example filename) is not a citation.
          CITE = re.compile(r"`([^`\n]+)`|((?<![\w./-])[\w./-]+\.\w+:\d+)")
          PATHISH = re.compile(r"^\.?/?[\w./-]+$")

          def resolve(cand):
              cand = re.sub(r":\d+(?:[-–]\d+)?\s*$", "", cand.strip())
              cand = re.sub(r"^\./", "", cand)
              if not cand or not PATHISH.match(cand):
                  return []
              if cand in repo:
                  return [cand]
              return sorted(f for f in repo if f.endswith("/" + cand))

          kept, demoted = [], []
          for f in v["findings"]:
              cited = set()
              for m in CITE.finditer(f):
                  cited.update(resolve(m.group(1) or m.group(2)))
              hit = sorted(cited & changed)
              if cited and not hit:
                  demoted.append(f)
                  print(f"demoted (cites only unchanged files {sorted(cited)}): {f[:120]}", file=sys.stderr)
              else:
                  kept.append(f)
                  print(f"kept (cites {hit or 'no repo file'}): {f[:120]}", file=sys.stderr)

          out = dict(v)
          out["codex_blocking"] = v["blocking"]
          out["findings"] = kept
          out["demoted"] = demoted
          if v["blocking"] and demoted and not kept:
              out["blocking"] = False
              print("every finding cites only unchanged files; verdict is now non-blocking", file=sys.stderr)
          json.dump(out, sys.stdout)
          PY

      # Anyone who can read the repository can download an artifact, so every
      # registered secret's value is replaced with `***` in the verdict's text
      # fields before the file leaves this job. The structural fields are left
      # alone — no secret's value is a boolean — so the gate decides the same on
      # the sanitised file as on the one the scoping step wrote. A verdict that
      # is not JSON is sanitised as text and leaves `has_verdict` false, which
      # is the no-verdict path.
      - name: Sanitise the verdict
        id: sanitise
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          SCOPED_PATH: ${{ runner.temp }}/scoped.json
          VERDICT_OUT: ${{ runner.temp }}/codex-verdict/verdict.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$VERDICT_OUT")"
          python3 - "$SCOPED_PATH" "$VERDICT_OUT" <<'PY'
          import json, os, sys

          # The secrets this workflow registers. A name with no value in the
          # environment contributes nothing.
          NAMES = ("CODEX_AUTH_JSON", "TS_OAUTH_CLIENT_ID", "TS_OAUTH_SECRET", "GITHUB_TOKEN")

          src, dst = sys.argv[1:3]
          raw = open(src).read()
          values = [v for v in (os.environ.get(n, "") for n in NAMES) if v]

          def clean(s):
              for v in values:
                  s = s.replace(v, "***")
              return s

          try:
              v = json.loads(raw)
          except ValueError:
              v = None
          if isinstance(v, dict):
              if isinstance(v.get("summary"), str):
                  v["summary"] = clean(v["summary"])
              for key in ("findings", "demoted"):
                  if isinstance(v.get(key), list):
                      v[key] = [clean(f) if isinstance(f, str) else f for f in v[key]]
              text = json.dumps(v)
          else:
              text = clean(raw)
          with open(dst, "w") as out:
              out.write(text)
          PY
          if [ -s "$VERDICT_OUT" ] && jq -e . "$VERDICT_OUT" >/dev/null 2>&1; then
            echo "has_verdict=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_verdict=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The reviewer answered with nothing usable as a verdict; review_gate will fail closed. What it said, sanitised:"
            head -c 2000 "$VERDICT_OUT" || true
          fi

      # `overwrite` so a re-run of this job alone replaces the last attempt's
      # file rather than being refused for a name that already exists.
      - name: Upload the verdict
        uses: actions/upload-artifact@v4
        with:
          name: codex-verdict
          path: ${{ runner.temp }}/codex-verdict/verdict.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      - name: Delete the Codex login
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/codex-home"

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: github.event_name == 'pull_request' && needs.codex.outputs.has_verdict == 'true'
    permissions:
      # Read-only on Actions, for the verdict artifact from this same run.
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Download the verdict
        uses: actions/download-artifact@v4
        with:
          name: codex-verdict
          path: ${{ runner.temp }}/codex-verdict
      - name: Report Codex feedback
        uses: actions/github-script@v7
        env:
          CODEX_VERDICT_PATH: ${{ runner.temp }}/codex-verdict/verdict.json
          # The PR head this verdict read, which the next run's prompt step
          # diffs from.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const v = JSON.parse(require('fs').readFileSync(process.env.CODEX_VERDICT_PATH, 'utf8'))
            const lines = [v.summary, ...(v.findings ?? []).map(f => `- ${f}`)]
            if (v.blocking) {
              lines.unshift('**Blocking — this merge is held until these are addressed or overridden.**', '')
            } else if (v.codex_blocking) {
              lines.unshift('Codex marked this blocking, but every finding cites only files this PR does not change, so the gate treats it as non-blocking.', '')
            }
            if (v.demoted?.length) {
              lines.push('', '**Pre-existing, not blocking** — these cite only files this PR does not change:',
                ...v.demoted.map(f => `- ${f}`))
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              // The first line is what the githubpr channel matches on to
              // deliver this review back to the session that opened the PR.
              // Changing it does not break the review; it breaks the fix loop,
              // silently. The second names the PR head this verdict read, which
              // scripts/review-prompt.sh diffs the next review from.
              body: `<!-- agent-review: codex -->\n<!-- agent-review-sha: ${process.env.HEAD_SHA} -->\n### Codex review\n\n${lines.join('\n')}`,
            })

  # "The reviewer said no" and "there is no verdict" are different answers, and
  # one red check cannot say which. So the gate is two jobs, and *which one is
  # red* is the diagnosis:
  #
  #   reviewer_ran   red  ⇒ no verdict exists. Infrastructure or a draft.
  #                         Re-runnable; not a statement about the code.
  #   review_gate    red  ⇒ the reviewer ran and its verdict blocks, or it
  #                         answered with nothing usable. A review decision.
  #
  # Readable without opening a log:
  #   gh api repos/OWNER/REPO/actions/runs/RUNID/jobs \
  #     -q '.jobs[]|"\(.name): \(.conclusion) steps=\(.steps|length)"'
  #
  # Both fail closed and neither can be skipped into green. automerge merges
  # only on this workflow concluding `completed success`, so either job red
  # holds the merge — and a `cancelled` or `skipped` conclusion holds it too:
  # concurrency cancels a superseded run, `!cancelled()` skips both jobs, and
  # the run concludes `cancelled` rather than red.
  #
  # Neither runs outside a pull request: a nightly or dispatched run has no PR
  # to review, and its conclusion is the suite's.
  reviewer_ran:
    needs: [select, topo_unit, topo_ui, others, test, codex, post_feedback]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert a verdict was produced and delivered
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          SUITE_RESULTS: >-
            select=${{ needs.select.result }}
            topo_unit=${{ needs.topo_unit.result }}
            topo_ui=${{ needs.topo_ui.result }}
            others=${{ needs.others.result }}
            test=${{ needs.test.result }}
          CODEX_RESULT: ${{ needs.codex.result }}
          FEEDBACK_RESULT: ${{ needs.post_feedback.result }}
        run: |
          set -euo pipefail

          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error::No verdict: this PR is a draft, so the reviewer was deliberately skipped. Mark it ready for review — nothing here is a review decision."
            exit 1
          fi
          # Named before the reviewer's own result, because a red fast job is
          # why the reviewer did not run and "the reviewer job did not
          # complete" would send a reader to the wrong log, and a red
          # `topo_ui` holds the merge whatever the verdict. Every suite job
          # that did not pass is named.
          red=""
          for pair in $SUITE_RESULTS; do
            [ "${pair#*=}" = success ] || red="$red ${pair%%=*} (${pair#*=})"
          done
          if [ -n "$red" ]; then
            echo "::error::Not mergeable: the suite did not pass —$red — whatever any verdict says, and a red fast job means the reviewer was deliberately not spent on it. Fix the suite — nothing here is a review decision."
            exit 1
          fi
          if [ "$CODEX_RESULT" != "success" ]; then
            echo "::error::No verdict: the reviewer job did not complete (result: $CODEX_RESULT). Re-run the failed jobs — nothing here is a review decision."
            exit 1
          fi

          # Past this point the reviewer ran, so whatever it returned — a
          # verdict or nothing usable — is review_gate's to judge. A *skipped*
          # post_feedback is not a failure here: the job is gated on
          # `has_verdict`, so skipped means the reviewer answered with nothing
          # usable, and that is a review outcome this job must not relabel as
          # infrastructure. Only an outright failure or cancellation is: a
          # verdict existed and never reached the PR.
          case "$FEEDBACK_RESULT" in
            failure | cancelled)
              echo "::error::No verdict delivered: the reviewer answered but post_feedback did not post it (result: $FEEDBACK_RESULT). Re-run the failed jobs — nothing here is a review decision."
              exit 1
              ;;
          esac

          echo "The reviewer ran; its answer is review_gate's to enforce."

  # The verdict, and deliberately after post_feedback: a blocking verdict must
  # still reach the PR (and through it the session) before it fails the run.
  #
  # `needs: reviewer_ran` is load-bearing beyond ordering. This job exits 0 when
  # no verdict exists, on the sole grounds that reviewer_ran has already gone
  # red in exactly those cases — so a copy of this workflow that dropped
  # reviewer_ran would leave a verdict-free run green and automerge would merge
  # it unreviewed. Naming the job here makes that copy refuse to parse instead
  # of silently opening the hole, and the guard below re-checks the invariant at
  # runtime rather than trusting the comment.
  #
  # This is the required status check on main.
  review_gate:
    needs: [reviewer_ran, select, topo_unit, topo_ui, others, test, codex, post_feedback]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only on Actions, for the verdict artifact from this same run.
      actions: read
    steps:
      # Only when there is one to download. The job's own guard stays
      # `!cancelled()`, so a false or absent flag still reaches the checks
      # below with no verdict in hand, which is what they fail closed on.
      - name: Download the verdict
        if: ${{ needs.codex.outputs.has_verdict == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: codex-verdict
          path: ${{ runner.temp }}/codex-verdict
      - name: Enforce the review verdict
        id: verdict
        env:
          PRECHECK_RESULT: ${{ needs.reviewer_ran.result }}
          CODEX_RESULT: ${{ needs.codex.result }}
          HAS_VERDICT: ${{ needs.codex.outputs.has_verdict }}
          VERDICT_FILE: ${{ runner.temp }}/codex-verdict/verdict.json
        run: |
          set -euo pipefail

          # The verdict is the artifact's one file. No flag, or a flag with no
          # readable file behind it, leaves this empty — which is no verdict,
          # and falls into the fail-closed case at the bottom.
          VERDICT=""
          if [ "${HAS_VERDICT:-}" = "true" ]; then
            if [ -s "$VERDICT_FILE" ]; then
              VERDICT="$(cat "$VERDICT_FILE")"
            else
              echo "::error::The reviewer reported a verdict but $VERDICT_FILE is missing or empty."
            fi
          fi

          # Everything below records the outcome for the status-pane step, then
          # exits with it; `state` is pass|block, `summary` is the verdict's
          # summary, which a re-review writes as several lines (its list of
          # earlier findings), so it goes to the output file as a delimited
          # block and never as `summary=` on one line, which the runner
          # refuses for a value with a newline in it and fails the step. The
          # block's delimiter is random per call, since the summary is the
          # reviewer's text and a fixed delimiter is a line it could contain,
          # which would end the block early and fail the step on what follows.
          finish() {
            local eom
            eom="TOPO_SUMMARY_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            { echo "state=$1"; echo "summary<<$eom"; echo "$2"; echo "$eom"; } >> "$GITHUB_OUTPUT"
            exit "$3"
          }

          if [ "$CODEX_RESULT" != "success" ]; then
            # No verdict exists, so there is no review decision to report and
            # this check must not read as one. reviewer_ran owns the reason.
            # Assert it actually took the failure: if it is green here the split
            # has broken and the run would otherwise conclude success with
            # nothing reviewed, so fail closed instead.
            if [ "$PRECHECK_RESULT" = "success" ]; then
              echo "::error::No verdict exists (reviewer: $CODEX_RESULT) but reviewer_ran passed. The gate split is broken; failing closed."
              finish block "gate split broken: no verdict but reviewer_ran passed" 1
            fi
            echo "No verdict to enforce (reviewer job: $CODEX_RESULT). Not a review decision — see the reviewer_ran check for why."
            finish block "no verdict: reviewer job $CODEX_RESULT (see reviewer_ran)" 0
          fi

          # The CLI's last message is whatever it emitted; nothing checks it
          # against the schema. So a reviewer that answered in prose, or
          # with JSON of the wrong shape, reaches here — and reading `.blocking`
          # off it with a bare `jq` inside an `if` yields the empty string, which
          # is not "true", which reads as a clean review. Demand all three
          # required fields and treat everything else as no verdict at all.
          blocking="$(jq -r 'if type == "object" and (.blocking | type) == "boolean" and (.summary | type) == "string" and (.findings | type) == "array" then .blocking else "invalid" end' <<<"$VERDICT" 2>/dev/null || echo invalid)"
          summary="$(jq -r '.summary? // "" | .[0:300]' <<<"$VERDICT" 2>/dev/null || true)"

          # A reviewer that gave up but still answered `blocking: false` — the
          # prompt tells it to block instead, but the gate does not trust the
          # prompt: no findings and a summary that opens with an admission of
          # failure is no verdict, not a pass.
          gave_up="$(jq -r 'if .blocking == false and (.findings | length) == 0 and (.summary | test("^\\s*(unable|not able|could ?n.t|cannot|can.t|failed|i was unable|i could not|i cannot|did not complete|couldn)"; "i")) then "true" else "false" end' <<<"$VERDICT" 2>/dev/null || echo false)"

          case "$blocking" in
            false)
              if [ "$gave_up" = "true" ]; then
                echo "::error::The reviewer reported it could not complete the review; that is no verdict, not a pass."
                jq -r '.summary' <<<"$VERDICT"
                finish block "reviewer could not complete the review: $summary" 1
              fi
              echo "Review verdict: not blocking."
              if [ "$(jq -r '.codex_blocking? // false' <<<"$VERDICT")" = "true" ]; then
                echo "Codex answered blocking; every finding was demoted as pre-existing (cites only files this PR does not change):"
                jq -r '.demoted[]? // empty' <<<"$VERDICT" | sed 's/^/  - /'
              fi
              finish pass "$summary" 0
              ;;
            true)
              echo "::error::Review is blocking. See the Codex review comment on the PR."
              # `.findings[]` on a verdict without the key exits 5 under pipefail
              # and aborts the gate before it can name the reason.
              jq -r '.findings[]? // empty' <<<"$VERDICT" | sed 's/^/  - /'
              finish block "$summary" 1
              ;;
            *)
              # The reviewer ran to completion and answered with nothing usable.
              # Not re-runnable infrastructure: the reviewer answered, and this
              # is what it said.
              echo "::error::The reviewer ran but returned no usable verdict. Not re-runnable infrastructure — the reviewer answered, and this is what it said:"
              printf '%s\n' "$VERDICT" | head -c 2000
              finish block "reviewer returned no usable verdict" 1
              ;;
          esac

      - name: Join the tailnet, to reach the status pane
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' }}
        # Best-effort like the POST it enables: a Tailscale outage or an expired
        # OAuth client must not fail `codex` or the required `review_gate` and hold
        # a mergeable PR. Without this the status feed becomes a merge dependency.
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}

      - name: Tell the status pane the verdict
        if: ${{ always() }}
        env:
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          STATE: ${{ steps.verdict.outputs.state || 'block' }}
          SUMMARY: ${{ steps.verdict.outputs.summary || 'review_gate did not reach a verdict' }}
        run: |
          jq -nc --argjson pr "$PR" --arg branch "$BRANCH" --arg state "$STATE" --arg summary "$SUMMARY" --arg ts "$(date -u +%FT%TZ)" \
            '{pr: $pr, branch: $branch, state: $state, summary: $summary, ts: $ts}' \
            | curl -sS -m 10 -X POST -H 'content-type: application/json' --data-binary @- "$STATUS_PANE_URL" \
            || echo "::warning::status pane unreachable"
