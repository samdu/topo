# The merge gate. Codex reviews every non-draft PR and its verdict is what
# gates: `review_gate` is the only required status check on main, and
# automerge.yaml merges on this workflow concluding green. The Swift suite runs
# in tests.yaml as a signal, deliberately outside this workflow, so a queued or
# absent macOS runner cannot hold a merge.
#
# Codex signs in with a ChatGPT-mode login rather than an API key: the
# `CODEX_AUTH_JSON` secret is the contents of a `~/.codex/auth.json` from a
# `codex login`, written into a private codex-home for the run, and the CLI
# authenticates from that file. Store it as ONE line (`jq -c . auth.json |
# gh secret set CODEX_AUTH_JSON`): the runner masks every line of a multi-line
# secret, and a pretty-printed file's `{` and `}` lines then get every JSON
# verdict flagged as "may contain secret" and dropped from the job outputs.
# Refresh it with a new `codex login` when the reviewer starts failing with
# 401s.
#
# That login is a reusable credential on a runner that also holds PR content,
# and Codex reads that content. The exposure is bounded, not removed: the
# trigger is `pull_request` (never `pull_request_target`), so a fork PR gets
# no secrets and no reviewer; the codex job runs only for branches of this
# repository; the CLI runs in its read-only sandbox, which denies its tool
# commands the network and the filesystem outside the checkout; and the login
# is deleted when the job ends. What remains — a same-repo branch carrying
# instructions that steer the reviewer — is accepted by design: a compromised
# same-repo branch already means a compromised agent with push rights.
#
# The verdict is scoped to the diff mechanically, not by prompt. The prompt
# asks Codex to review only the PR's changes, and it still blocks on defects in
# files the PR never touched. So after Codex answers, a step in the codex job
# resolves every path each finding cites (`path:line`, or a backticked path)
# against the checkout and the PR's changed-file list. A finding whose cited
# files are all real repo files and none of them changed in this PR is
# demoted: it is posted under "Pre-existing, not blocking" and does not count
# toward `blocking`; if every finding is demoted the verdict becomes
# non-blocking. A finding that cites no repo file at all keeps whatever Codex
# decided, and an answer that is not a valid verdict passes through untouched
# so review_gate's no-verdict handling still sees it.
name: PR validate

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is here so the ready transition starts a run at all —
    # without it, a draft marked ready sits on whatever its last draft run
    # concluded until someone pushes. It is not what skips the reviewer on
    # drafts; the `if` on the codex job does that.
    types: [opened, synchronize, reopened, ready_for_review]

# One run per PR: a superseded push should not keep burning a reviewer.
concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The status pane's review feed. Best-effort: a pane that is down must not
  # redden a review.
  STATUS_PANE_URL: https://experiments.hexagon.zone/topo-status/api/review

jobs:
  # Codex runs the CLI in the runner with the repo checked out, so unlike a
  # single-shot reviewer it can open the file the diff only mentions. Its
  # verdict is a step exit code in review_gate below, which is what makes it a
  # gate rather than a comment.
  #
  # Skipped while the PR is a draft: an agent opens the PR as a draft, iterates
  # against the free local reviewer, and marks it ready — that transition is
  # what first spends a Codex round.
  codex:
    # Same-repo branches only: a fork PR carries untrusted content and must
    # never meet the login. (A fork PR then has no verdict, reviewer_ran goes
    # red, and it stays a human merge.)
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Read-only, for the PR's changed-file list in the scoping step.
      pull-requests: read
    outputs:
      final_message: ${{ steps.scope.outputs.final-message }}
    steps:
      - name: Tell the status pane the review is running
        env:
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          jq -nc --argjson pr "$PR" --arg branch "$BRANCH" --arg ts "$(date -u +%FT%TZ)" \
            '{pr: $pr, branch: $branch, state: "running", summary: "Codex review running", ts: $ts}' \
            | curl -sS -m 10 -X POST -H 'content-type: application/json' --data-binary @- "$STATUS_PANE_URL" \
            || echo "::warning::status pane unreachable"

      # This job holds read permissions and nothing more: the persisted token
      # is repo-scoped and cannot push, comment or merge. The job that comments
      # is a separate one, with no checkout.
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Pre-fetch base and head refs for the PR
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Write the Codex login
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::CODEX_AUTH_JSON secret is unset; the reviewer has no login."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/codex-home"
          chmod 700 "$RUNNER_TEMP/codex-home"
          printf '%s' "$CODEX_AUTH_JSON" > "$RUNNER_TEMP/codex-home/auth.json"
          chmod 600 "$RUNNER_TEMP/codex-home/auth.json"
          jq -e '.auth_mode == "chatgpt" and (.tokens.access_token | type) == "string"' \
            "$RUNNER_TEMP/codex-home/auth.json" >/dev/null \
            || { echo "::error::CODEX_AUTH_JSON is not a chatgpt-mode codex auth.json."; exit 1; }

      # The Codex CLI directly rather than openai/codex-action: the action
      # unconditionally waits on the Responses proxy its API-key path starts,
      # so it cannot run on a ChatGPT login. `codex exec` reads the login from
      # $CODEX_HOME/auth.json on its own.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Codex CLI
        run: npm install -g @openai/codex && codex --version

      # The CLI's read-only sandbox is bubblewrap, and Ubuntu 24.04 runners
      # block unprivileged user namespaces via AppArmor (bwrap fails with
      # `loopback: Failed RTM_NEWADDR: Operation not permitted`). Same fix
      # openai/codex-action applies on hosted Linux runners.
      - name: Enable user namespaces for the Codex sandbox
        run: |
          set -euo pipefail
          if [ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo 1)" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Codex
        id: run_codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_MODEL: gpt-5.6-sol
          # A verdict the workflow can act on. Free prose can only be posted;
          # a schema makes "does this block the merge" a field.
          OUTPUT_SCHEMA: |
            {"type": "object", "additionalProperties": false, "properties": {"blocking": {"type": "boolean"}, "summary": {"type": "string"}, "findings": {"type": "array", "items": {"type": "string"}}}, "required": ["blocking", "summary", "findings"]}
          PROMPT: |
            Review PR #${{ github.event.pull_request.number }} in this
            repository. Review ONLY the changes it introduces.

            This repo is Topo: one always-on agent per person, every Apple
            device a limb of it, sharing one transcript through the user's own
            iCloud account. Read CLAUDE.md and docs/design.md first — they
            hold the invariants the diff will not spell out.

            Where the risk lives in this repo — look hardest here. These are
            pointers to where a serious problem is likely to be, not a second
            blocking bar: a finding only blocks if it also meets the blocking
            test at the end of this prompt.
            - The transcript log is append-only: one record per turn, per-device
              sequence numbers, create-only saves. Anything that can overwrite,
              skip or duplicate a turn, or that writes a record without a
              compare-and-set on its change tag.
            - The primary lease: two devices both believing they are primary
              for longer than the lease duration, a heartbeat that keeps a lost
              lease alive, a claim that is not atomic.
            - CloudKit is truth, sockets are speed: a path that only works when
              a socket is up, or that treats a socket's view as authoritative
              over the records.
            - The test doubles: `InMemoryRecordDatabase` reproducing weaker
              semantics than CloudKit's, so the suite passes on behaviour the
              real store rejects.
            - Licensing: GPL code from others reaching a bundle, or a borrowed
              piece with no entry in THIRD-PARTY.
            - The tests. The Swift suite runs on macOS in the separate,
              non-gating `Tests` workflow; this runner is Linux with no Swift
              toolchain and your sandbox is read-only, so do not try to build
              or run anything — review the tests by reading them. A test that
              cannot fail is yours to notice.

            You can read any file in the checkout — do that rather than
            guessing, and cite `path:line` for every finding. Skip style and
            formatting; report only what would actually break something, and
            say plainly if you find nothing.

            Review the diff, not the repository. A defect in a file the PR
            does not touch is not this PR's to fix: mention it in `summary`
            as pre-existing, never as a blocking finding. In particular the
            workflows under `.github/workflows/` run PR-authored code with a
            reviewer credential and a write token for same-repository
            branches; that exposure is accepted by design, documented in this
            file's header, and is not a finding on any PR that does not
            change those workflows.

            Return JSON matching the schema. Set `blocking` true only for a
            finding that should stop this merge — something that would break at
            runtime, lose or corrupt a record, split the primary, leak a secret,
            or ship code the licence forbids. Style, naming, missing tests and
            things you would merely prefer are not blocking. `summary` is what
            a reader sees; `findings` is one string per issue, each citing
            `path:line`. Say plainly when you find nothing.

            If you cannot complete the review — the checkout is unreadable,
            the diff will not load, anything that stops you reading — set
            `blocking` true and say why in `summary`. A review you could not
            do is not a clean review. A build or test command the sandbox
            refuses is not that: you review by reading, and every file you
            need is in the checkout.
        run: |
          set -euo pipefail
          printf '%s' "$OUTPUT_SCHEMA" > "$RUNNER_TEMP/schema.json"
          # read-only: the reviewer's tool commands get no network and no
          # writes, so a prompt-injected `curl` of the login has nowhere to go.
          # The model call itself is made by the codex process, outside the
          # sandbox.
          printf '%s' "$PROMPT" | codex exec \
            --model "$CODEX_MODEL" \
            --sandbox read-only \
            --skip-git-repo-check \
            --color never \
            --output-schema "$RUNNER_TEMP/schema.json" \
            --output-last-message "$RUNNER_TEMP/verdict.json" \
            -

      # The diff-scope rule from the header. Owns the job's `final-message`
      # output: a valid verdict leaves here with its findings split into
      # `findings` (kept) and `demoted` (cite only unchanged files), plus
      # `codex_blocking` recording what Codex itself said; anything that is
      # not a valid verdict leaves here verbatim.
      - name: Scope the verdict to the diff
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERDICT_PATH: ${{ runner.temp }}/verdict.json
        run: |
          set -euo pipefail
          # Renames list under their new name; the old name counts as changed
          # too so a finding citing either spelling stays in scope.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          echo "Changed files:"; sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          git ls-files -z > "$RUNNER_TEMP/repo-files.txt"
          python3 - "$VERDICT_PATH" "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/repo-files.txt" > "$RUNNER_TEMP/scoped.json" <<'PY'
          import json, re, sys

          verdict_path, changed_path, repo_path = sys.argv[1:4]
          raw = open(verdict_path).read()
          try:
              v = json.loads(raw)
              ok = (isinstance(v, dict) and isinstance(v.get("blocking"), bool)
                    and isinstance(v.get("summary"), str) and isinstance(v.get("findings"), list)
                    and all(isinstance(f, str) for f in v["findings"]))
          except ValueError:
              ok = False
          if not ok:
              print("verdict is not a valid {blocking, summary, findings}; passing it through unscoped", file=sys.stderr)
              sys.stdout.write(raw)
              sys.exit(0)

          changed = {l.strip() for l in open(changed_path) if l.strip()}
          repo = {p for p in open(repo_path).read().split("\0") if p}

          # A cite is `path:line` anywhere, or anything in backticks. Both are
          # only candidates: one that does not resolve to a file in the checkout
          # (a symbol, an example filename) is not a citation.
          CITE = re.compile(r"`([^`\n]+)`|((?<![\w./-])[\w./-]+\.\w+:\d+)")
          PATHISH = re.compile(r"^\.?/?[\w./-]+$")

          def resolve(cand):
              cand = re.sub(r":\d+(?:[-–]\d+)?\s*$", "", cand.strip())
              cand = re.sub(r"^\./", "", cand)
              if not cand or not PATHISH.match(cand):
                  return []
              if cand in repo:
                  return [cand]
              return sorted(f for f in repo if f.endswith("/" + cand))

          kept, demoted = [], []
          for f in v["findings"]:
              cited = set()
              for m in CITE.finditer(f):
                  cited.update(resolve(m.group(1) or m.group(2)))
              hit = sorted(cited & changed)
              if cited and not hit:
                  demoted.append(f)
                  print(f"demoted (cites only unchanged files {sorted(cited)}): {f[:120]}", file=sys.stderr)
              else:
                  kept.append(f)
                  print(f"kept (cites {hit or 'no repo file'}): {f[:120]}", file=sys.stderr)

          out = dict(v)
          out["codex_blocking"] = v["blocking"]
          out["findings"] = kept
          out["demoted"] = demoted
          if v["blocking"] and demoted and not kept:
              out["blocking"] = False
              print("every finding cites only unchanged files; verdict is now non-blocking", file=sys.stderr)
          json.dump(out, sys.stdout)
          PY
          # Multi-line output, so a heredoc delimiter the verdict cannot contain.
          d="verdict-$RANDOM$RANDOM"
          { echo "final-message<<$d"; cat "$RUNNER_TEMP/scoped.json"; echo; echo "$d"; } >> "$GITHUB_OUTPUT"

      - name: Delete the Codex login
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/codex-home"

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: needs.codex.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report Codex feedback
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const v = JSON.parse(process.env.CODEX_FINAL_MESSAGE)
            const lines = [v.summary, ...(v.findings ?? []).map(f => `- ${f}`)]
            if (v.blocking) {
              lines.unshift('**Blocking — this merge is held until these are addressed or overridden.**', '')
            } else if (v.codex_blocking) {
              lines.unshift('Codex marked this blocking, but every finding cites only files this PR does not change, so the gate treats it as non-blocking.', '')
            }
            if (v.demoted?.length) {
              lines.push('', '**Pre-existing, not blocking** — these cite only files this PR does not change:',
                ...v.demoted.map(f => `- ${f}`))
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              // The marker is what the githubpr channel matches on to deliver
              // this review back to the session that opened the PR. Removing it
              // does not break the review; it breaks the fix loop, silently.
              body: `<!-- agent-review: codex -->\n### Codex review\n\n${lines.join('\n')}`,
            })

  # "The reviewer said no" and "there is no verdict" are different answers, and
  # one red check cannot say which. So the gate is two jobs, and *which one is
  # red* is the diagnosis:
  #
  #   reviewer_ran   red  ⇒ no verdict exists. Infrastructure or a draft.
  #                         Re-runnable; not a statement about the code.
  #   review_gate    red  ⇒ the reviewer ran and its verdict blocks, or it
  #                         answered with nothing usable. A review decision.
  #
  # Readable without opening a log:
  #   gh api repos/OWNER/REPO/actions/runs/RUNID/jobs \
  #     -q '.jobs[]|"\(.name): \(.conclusion) steps=\(.steps|length)"'
  #
  # Both fail closed and neither can be skipped into green. automerge merges
  # only on this workflow concluding `completed success`, so either job red
  # holds the merge — and a `cancelled` or `skipped` conclusion holds it too:
  # concurrency cancels a superseded run, `!cancelled()` skips both jobs, and
  # the run concludes `cancelled` rather than red.
  reviewer_ran:
    needs: [codex, post_feedback]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert a verdict was produced and delivered
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          CODEX_RESULT: ${{ needs.codex.result }}
          FEEDBACK_RESULT: ${{ needs.post_feedback.result }}
        run: |
          set -euo pipefail

          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error::No verdict: this PR is a draft, so the reviewer was deliberately skipped. Mark it ready for review — nothing here is a review decision."
            exit 1
          fi
          if [ "$CODEX_RESULT" != "success" ]; then
            echo "::error::No verdict: the reviewer job did not complete (result: $CODEX_RESULT). Re-run the failed jobs — nothing here is a review decision."
            exit 1
          fi

          # Past this point the reviewer ran, so whatever it returned — a
          # verdict or nothing usable — is review_gate's to judge. A *skipped*
          # post_feedback is not a failure here: the job is gated on a
          # non-empty final_message, so skipped means the reviewer answered
          # with nothing, and an empty answer is a review outcome this job must
          # not relabel as infrastructure. Only an outright failure or
          # cancellation is: a verdict existed and never reached the PR.
          case "$FEEDBACK_RESULT" in
            failure | cancelled)
              echo "::error::No verdict delivered: the reviewer answered but post_feedback did not post it (result: $FEEDBACK_RESULT). Re-run the failed jobs — nothing here is a review decision."
              exit 1
              ;;
          esac

          echo "The reviewer ran; its answer is review_gate's to enforce."

  # The verdict, and deliberately after post_feedback: a blocking verdict must
  # still reach the PR (and through it the session) before it fails the run.
  #
  # `needs: reviewer_ran` is load-bearing beyond ordering. This job exits 0 when
  # no verdict exists, on the sole grounds that reviewer_ran has already gone
  # red in exactly those cases — so a copy of this workflow that dropped
  # reviewer_ran would leave a verdict-free run green and automerge would merge
  # it unreviewed. Naming the job here makes that copy refuse to parse instead
  # of silently opening the hole, and the guard below re-checks the invariant at
  # runtime rather than trusting the comment.
  #
  # This is the required status check on main.
  review_gate:
    needs: [reviewer_ran, codex, post_feedback]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the review verdict
        id: verdict
        env:
          PRECHECK_RESULT: ${{ needs.reviewer_ran.result }}
          CODEX_RESULT: ${{ needs.codex.result }}
          VERDICT: ${{ needs.codex.outputs.final_message }}
        run: |
          set -euo pipefail

          # Everything below records the outcome for the status-pane step, then
          # exits with it; `state` is pass|block, `summary` is one line.
          finish() {
            { echo "state=$1"; echo "summary=$2"; } >> "$GITHUB_OUTPUT"
            exit "$3"
          }

          if [ "$CODEX_RESULT" != "success" ]; then
            # No verdict exists, so there is no review decision to report and
            # this check must not read as one. reviewer_ran owns the reason.
            # Assert it actually took the failure: if it is green here the split
            # has broken and the run would otherwise conclude success with
            # nothing reviewed, so fail closed instead.
            if [ "$PRECHECK_RESULT" = "success" ]; then
              echo "::error::No verdict exists (reviewer: $CODEX_RESULT) but reviewer_ran passed. The gate split is broken; failing closed."
              finish block "gate split broken: no verdict but reviewer_ran passed" 1
            fi
            echo "No verdict to enforce (reviewer job: $CODEX_RESULT). Not a review decision — see the reviewer_ran check for why."
            finish block "no verdict: reviewer job $CODEX_RESULT (see reviewer_ran)" 0
          fi

          # The CLI's last message is whatever it emitted; nothing checks it
          # against the schema. So a reviewer that answered in prose, or
          # with JSON of the wrong shape, reaches here — and reading `.blocking`
          # off it with a bare `jq` inside an `if` yields the empty string, which
          # is not "true", which reads as a clean review. Demand all three
          # required fields and treat everything else as no verdict at all.
          blocking="$(jq -r 'if type == "object" and (.blocking | type) == "boolean" and (.summary | type) == "string" and (.findings | type) == "array" then .blocking else "invalid" end' <<<"$VERDICT" 2>/dev/null || echo invalid)"
          summary="$(jq -r '.summary? // "" | .[0:300]' <<<"$VERDICT" 2>/dev/null || true)"

          # A reviewer that gave up but still answered `blocking: false` — the
          # prompt tells it to block instead, but the gate does not trust the
          # prompt: no findings and a summary that opens with an admission of
          # failure is no verdict, not a pass.
          gave_up="$(jq -r 'if .blocking == false and (.findings | length) == 0 and (.summary | test("^\\s*(unable|not able|could ?n.t|cannot|can.t|failed|i was unable|i could not|i cannot|did not complete|couldn)"; "i")) then "true" else "false" end' <<<"$VERDICT" 2>/dev/null || echo false)"

          case "$blocking" in
            false)
              if [ "$gave_up" = "true" ]; then
                echo "::error::The reviewer reported it could not complete the review; that is no verdict, not a pass."
                jq -r '.summary' <<<"$VERDICT"
                finish block "reviewer could not complete the review: $summary" 1
              fi
              echo "Review verdict: not blocking."
              if [ "$(jq -r '.codex_blocking? // false' <<<"$VERDICT")" = "true" ]; then
                echo "Codex answered blocking; every finding was demoted as pre-existing (cites only files this PR does not change):"
                jq -r '.demoted[]? // empty' <<<"$VERDICT" | sed 's/^/  - /'
              fi
              finish pass "$summary" 0
              ;;
            true)
              echo "::error::Review is blocking. See the Codex review comment on the PR."
              # `.findings[]` on a verdict without the key exits 5 under pipefail
              # and aborts the gate before it can name the reason.
              jq -r '.findings[]? // empty' <<<"$VERDICT" | sed 's/^/  - /'
              finish block "$summary" 1
              ;;
            *)
              # The reviewer ran to completion and answered with nothing usable.
              # Not re-runnable infrastructure: the reviewer answered, and this
              # is what it said.
              echo "::error::The reviewer ran but returned no usable verdict. Not re-runnable infrastructure — the reviewer answered, and this is what it said:"
              printf '%s\n' "$VERDICT" | head -c 2000
              finish block "reviewer returned no usable verdict" 1
              ;;
          esac

      - name: Tell the status pane the verdict
        if: ${{ always() }}
        env:
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          STATE: ${{ steps.verdict.outputs.state || 'block' }}
          SUMMARY: ${{ steps.verdict.outputs.summary || 'review_gate did not reach a verdict' }}
        run: |
          jq -nc --argjson pr "$PR" --arg branch "$BRANCH" --arg state "$STATE" --arg summary "$SUMMARY" --arg ts "$(date -u +%FT%TZ)" \
            '{pr: $pr, branch: $branch, state: $state, summary: $summary, ts: $ts}' \
            | curl -sS -m 10 -X POST -H 'content-type: application/json' --data-binary @- "$STATUS_PANE_URL" \
            || echo "::warning::status pane unreachable"
