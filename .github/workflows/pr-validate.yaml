# The merge gate. No hosted runner runs the suites: they run on buddybox, at
# the commit being pushed, and scripts/validate-and-push.sh posts each one's
# result to that commit as a status (`local/topo_unit`, `local/topo_ui`,
# `local/others`, and `local/real_ear` on the full lane). Here `select` says
# which of them the PR's paths need, `test` reads those statuses off the PR
# head and is red on one that is missing or failed, and Codex reviews every
# non-draft PR whose `test` is green; its verdict is what gates. `review_gate`
# and `test` are the required status checks on main, and automerge.yaml merges
# on this workflow's latest pull_request run concluding green — so a suite
# that did not pass on the Mac holds the merge by both routes, and spends no
# reviewer round. Every job here runs on ubuntu-latest: a macOS runner bills
# at ten times a Linux one, and the three suites are about 77 runner-minutes
# a push against the account's 2,000 free minutes a month.
#
# Codex signs in with a ChatGPT-mode login rather than an API key: the
# `CODEX_AUTH_JSON` secret is the current `auth.json` of that login, written
# into a private codex-home for the run, and the CLI authenticates from that
# file. The CLI rotates the refresh token on first use, which spends the
# secret, so the codex job writes the rotated file back to `CODEX_AUTH_JSON`
# before it deletes the login; `CODEX_SECRET_PAT`, a fine-grained PAT on this
# repository with Secrets: write, is what lets it. The `codex_wait` job holds
# each run's `codex` until no other run's is in progress, so two runs do not
# start on the same login (after a 25-minute bound it goes ahead). A new
# `codex login` is needed only when the chain breaks — two runs on one login,
# a rotation the job could not write back — and shows as `refresh token was
# already used`. Store it as ONE line (`jq -c . auth.json | gh secret set
# CODEX_AUTH_JSON`), as the write-back does: the runner registers every line
# of a multi-line secret as a secret value of its own, so a pretty-printed
# file's `{` and `}` lines become values the log mask and the verdict's
# sanitise step both rewrite.
#
# That login is a reusable credential on a runner that also holds PR content,
# and Codex reads that content. The exposure is bounded, not removed: the
# trigger is `pull_request` (never `pull_request_target`), so a fork PR gets
# no secrets and no reviewer; the codex job runs only for branches of this
# repository; the CLI runs in its read-only sandbox, which denies its tool
# commands the network and the filesystem outside the checkout; and the login
# is deleted when the job ends. What remains — a same-repo branch carrying
# instructions that steer the reviewer — is accepted by design: a compromised
# same-repo branch already means a compromised agent with push rights.
#
# The verdict is scoped to the diff mechanically, not by prompt. The prompt
# asks Codex to review only the PR's changes, and it still blocks on defects in
# files the PR never touched. So after Codex answers, a step in the codex job
# resolves every path each finding cites (`path:line`, or a backticked path)
# against the checkout and the PR's changed-file list. A finding whose cited
# files are all real repo files and none of them changed in this PR is
# demoted: it is posted under "Pre-existing, not blocking" and does not count
# toward `blocking`; if every finding is demoted the verdict becomes
# non-blocking. A finding that cites no repo file at all keeps whatever Codex
# decided, and an answer that is not a valid verdict passes through untouched
# so review_gate's no-verdict handling still sees it.
#
# The reviewer reads a PR two ways. The first review is exhaustive: the
# prompt asks for every finding that meets the evidence rule, most serious
# first, since a defect left for a later round costs a full run. Every
# verdict post_feedback posts opens with two marker lines, the codex marker
# `<!-- agent-review: codex -->`, which the githubpr channel routes the review
# back to the session by and which never changes, and
# `<!-- agent-review-sha: <sha> -->`, the PR head that run reviewed
# (`pull_request.head.sha`, never the merge ref). A later run on the same PR
# is a re-review: scripts/review-prompt.sh finds the newest codex verdict,
# and when its SHA is an ancestor of this run's PR head, adds that verdict
# (fenced as the reviewer's own earlier output) and the PR's own commits
# between the two PR heads, each with its patch, after the description:
# commits the base also has and merge commits are left out, so a base merged
# into the branch is not shown as the fix. The re-review verifies
# each earlier finding as closed, still open or moot in `summary`, then
# reviews the change since; a finding in code the change since does not touch
# is reported and does not block. Four verdicts is the cap, and `review_cap`
# holds the reviewer from a fifth. No earlier verdict, one
# with no SHA marker, or a SHA that is not an ancestor is a first review,
# said in the prompt step's log; a `gh` that still fails after its retries
# fails the step, since the review round rests on what it reads.
#
# The verdict then travels as an artifact rather than a job output. GitHub
# drops a job output wholesale when its text contains the value of any
# registered secret, so a review that happened to quote one was discarded after
# it had been paid for. The codex job sanitises the scoped verdict instead —
# every registered secret's value replaced with `***` in `summary`, `findings`
# and `demoted`, the structural fields untouched — uploads that one file as the
# `codex-verdict` artifact, and its only job output is the boolean
# `has_verdict`, which no secret's value can match. Anyone who can read the
# repository can download an artifact, so nothing unsanitised is uploaded.
# post_feedback and review_gate read that file: post_feedback is gated on
# `has_verdict`, while review_gate's guard stays `!cancelled()` and the flag
# decides only whether it downloads, so a false or absent flag still reaches
# the fail-closed checks, where a missing or unusable file is no verdict.
# scripts/tests/review-verdict-test.sh runs the sanitise and gate snippets out
# of this file and holds all of that.
name: PR validate

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is here so the ready transition starts a run at all —
    # without it, a draft marked ready sits on whatever its last draft run
    # concluded until someone pushes. It is not what skips the reviewer on
    # drafts: `review_cap` reads whether the PR is a draft when the run
    # starts, and the reviewer jobs go by that.
    types: [opened, synchronize, reopened, ready_for_review]

# One run per PR: a superseded push's run is cancelled, so it burns neither
# minutes nor a reviewer.
#
# Which run survives is whichever GitHub created last, not whichever event
# happened last: a push and a `gh pr ready` a second apart start two runs on
# one head, and the `synchronize` run, whose payload still says draft, can be
# the later one and cancel the `ready_for_review` run. So no job reads the
# payload's `draft`. `review_cap` asks the API as the run starts, and every
# run created after the PR was marked ready reads it as ready, whichever
# event started it; a run created before that is the one cancelled.
concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The status pane's review feed. Best-effort: a pane that is down must not
  # redden a review.
  #
  # The pane lives on the tailnet now — it has no public route at all — so the two
  # jobs that post here join the tailnet first, as an ephemeral node that goes away
  # with the runner. Without TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET the join step is
  # skipped and the POST simply fails into its own warning, which is the same
  # best-effort behaviour as a pane that is down.
  STATUS_PANE_URL: https://pane.burmese-egret.ts.net/topo-status/api/review

jobs:
  # Which suites the PR's paths need and which lane the UI tests take, and
  # why, said in its log and its summary. The suites themselves run on
  # buddybox (scripts/mac-suite.sh, by scripts/validate-and-push.sh, which
  # reads the two lists below out of this file and makes the same choice from
  # the same scripts); what this job says is what `test` then requires a
  # status for.
  #
  # The lane is `full` when any changed path is on the voice path below or
  # when the diff cannot be read, `fast` otherwise (scripts/ci-select-lane.sh,
  # whose test reads this list and runs this step). The two differ in one
  # suite, `topo_ui`, and in one thing: the full lane fetches Parakeet's
  # models and runs the UI test in which the real ear hears the fixture
  # through the microphone; the fast lane deselects that test by name.
  # Everything else — the audio loopback, the press tests over the stub and
  # loading ears, every other suite — runs in both.
  #
  # The suites are the ones the changed paths need
  # (scripts/ci-select-suites.sh against SUITE_RULES below, whose test reads
  # the rules and runs that step): documentation and tooling no suite covers
  # need none of the three, a change only the hub, watch, TV, Womble or
  # TopoLink compile needs `others` alone, and anything else — the app, a
  # package the app links, the tests, the project, this workflow and its
  # scripts, a path no rule names, or a diff that cannot be read — needs all
  # three.
  #
  # The PR's own changes are `HEAD^1..HEAD` of GitHub's test merge commit,
  # whose first parent is main: what merging the PR would change on main.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      reason: ${{ steps.lane.outputs.reason }}
      topo_unit: ${{ steps.suites.outputs.topo_unit }}
      topo_ui: ${{ steps.suites.outputs.topo_ui }}
      others: ${{ steps.suites.outputs.others }}
      suites_reason: ${{ steps.suites.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Choose the lane
        id: lane
        env:
          # The voice path: a change to any of these runs the real ear on its
          # PR. One bash glob per line; `*` crosses `/`.
          VOICE_PATHS: |
            Apps/Client/AudioSession.swift
            Apps/Client/ChatView.swift
            Apps/Client/Composer.swift
            Apps/Client/DebugRun.swift
            Apps/Client/Ear.swift
            Apps/Client/ModelDownloads.swift
            Apps/Client/ModelHousekeeping.swift
            Apps/Client/Vocabulary.swift
            Apps/Client/VoiceInput.swift
            Apps/Topo/Resources/models.json
            Tests/ClientUI/*
            Tests/Fixtures/*
            Topo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            project.yml
            scripts/ci-audio-feeder.swift
            scripts/ci-audio-lane.sh
            scripts/ci-audio-meter.swift
            scripts/ci-require-tests.sh
            scripts/ci-select-lane.sh
            scripts/fetch-ear-models.sh
            scripts/mac-suite.sh
            scripts/validate-and-push.sh
            .github/workflows/pr-validate.yaml
        run: |
          set -euo pipefail
          # A diff that cannot be read selects full, inside the script.
          scripts/ci-select-lane.sh --git HEAD^1 HEAD > "$RUNNER_TEMP/lane.txt"
          cat "$RUNNER_TEMP/lane.txt" >> "$GITHUB_OUTPUT"
          lane="$(sed -n 's/^lane=//p' "$RUNNER_TEMP/lane.txt")"
          reason="$(sed -n 's/^reason=//p' "$RUNNER_TEMP/lane.txt")"
          echo "::notice title=Lane: $lane::$reason"
          echo "**Lane: $lane** — $reason" >> "$GITHUB_STEP_SUMMARY"
      - name: Choose the suites
        id: suites
        env:
          # A glob (`*` crosses `/`) and the suites a path matching it
          # needs: suite names, `all` or `none`. First match wins; a path no rule
          # matches needs all three, so the list only ever has to name what
          # may be skipped. The app target compiles Apps/Client, Apps/Shared,
          # Apps/Topo and every package but TopoLink (project.yml), so those
          # stay `all`; the hub, watch and TV targets (the watch's widgets and
          # suite included), Womble and TopoLink are built and tested only in
          # `others`, as are the janitor and validate-and-push.sh, whose tests
          # run there. The watch's suite
          # also builds Apps/Widgets, Apps/Shared, Apps/Client and TopoCore,
          # which `all` already sends to `others`.
          SUITE_RULES: |
            .github/workflows/pr-validate.yaml all
            .github/* none
            Apps/TopoHub/* others
            Apps/TopoTV/* others
            Apps/TopoWatch/* others
            Apps/TopoWatchWidgets/* others
            Apps/* all
            Packages/TopoLink/* others
            Packages/* all
            Tests/Watch/* others
            Tests/* all
            Womble/* others
            docs/* none
            *.md none
            .claude/* none
            Distribution/* none
            scripts/archive-upload.sh none
            scripts/plan-review.sh none
            .gitignore none
            scripts/janitor.py others
            scripts/tests/janitor* others
            scripts/validate-and-push.sh others
            scripts/tests/validate-and-push-test.sh others
        run: |
          set -euo pipefail
          # A diff that cannot be read selects every suite, inside the script.
          scripts/ci-select-suites.sh --git HEAD^1 HEAD > "$RUNNER_TEMP/suites.txt"
          cat "$RUNNER_TEMP/suites.txt" >> "$GITHUB_OUTPUT"
          run="$(grep -E '^(topo_unit|topo_ui|others)=true$' "$RUNNER_TEMP/suites.txt" | cut -d= -f1 | tr '\n' ' ' || true)"
          run="${run% }"
          reason="$(sed -n 's/^reason=//p' "$RUNNER_TEMP/suites.txt")"
          echo "::notice title=Suites: ${run:-none}::$reason"
          echo "**Suites: ${run:-none}** — $reason" >> "$GITHUB_STEP_SUMMARY"

  # The gate over the suites, and the required status check on main that holds
  # a red suite out. The suites ran on buddybox before the push, and
  # scripts/validate-and-push.sh posted one commit status per suite to the
  # commit it ran: `local/topo_unit`, `local/topo_ui`, `local/others`, and
  # `local/real_ear` when the UI tests took the full lane. This job is green
  # only when every one of those `select` says the PR needs is `success` on
  # the PR's head (`pull_request.head.sha`, never the merge commit), and it
  # names each that is not. A suite `select` output `false` for needs no
  # status; an output that is neither `true` nor `false`, or a `select` that
  # did not pass, is red. A lane that is not `fast` requires the real ear's.
  #
  # The script posts straight after its push, so a status is normally there
  # before this job starts; it waits STATUS_WAIT seconds for one that is not,
  # and no longer, since a commit pushed without the script never gets one
  # and every minute here is billed. A `failure` or `error` is red at once. A
  # head validated after its push (`scripts/validate-and-push.sh` on a commit
  # the branch already holds) has this job re-run by that script, when every
  # suite passed and this run had concluded.
  #
  # A status is the word of whoever holds a token that can write one, which
  # is the same-repo trust the header accepts: the gate is that the suites'
  # result is on record for the exact commit, not that a runner made it.
  # scripts/tests/suite-gate-test.sh runs this step against a fake `gh`.
  test:
    needs: select
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Read-only, for the suites' statuses on the PR head.
      statuses: read
    steps:
      - name: Require every suite passed on the Mac
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELECT_RESULT: ${{ needs.select.result }}
          SELECTED: >-
            topo_unit=${{ needs.select.outputs.topo_unit }}
            topo_ui=${{ needs.select.outputs.topo_ui }}
            others=${{ needs.select.outputs.others }}
          LANE: ${{ needs.select.outputs.lane }}
          SUITES_REASON: ${{ needs.select.outputs.suites_reason }}
          STATUS_WAIT: "120"
        run: |
          set -euo pipefail
          if [ "$SELECT_RESULT" != success ]; then
            echo "::error::select did not pass (result: ${SELECT_RESULT:-none}), so which suites this PR needs is unknown."
            exit 1
          fi
          case "$HEAD_SHA" in
            *[!0-9a-f]* | "") echo "::error::No PR head commit to read the suites' statuses from ('$HEAD_SHA')."; exit 1 ;;
          esac

          required=""
          unread=0
          for suite in topo_unit topo_ui others; do
            case " $SELECTED " in
              *" $suite=true "*) required="$required local/$suite" ;;
              *" $suite=false "*) echo "$suite: not needed by this PR's paths ($SUITES_REASON)" ;;
              *) echo "::error::select said neither true nor false for $suite."; unread=1 ;;
            esac
          done
          [ "$unread" = 0 ] || exit 1
          # The real ear, unless select said `fast` in so many words.
          case " $required " in
            *" local/topo_ui "*) [ "$LANE" = fast ] || required="$required local/real_ear" ;;
          esac
          if [ -z "$required" ]; then
            echo "No suite is needed, so no status is required."
            exit 0
          fi

          deadline=$((SECONDS + STATUS_WAIT))
          while :; do
            # The newest status of each context on the commit. A read that
            # fails is nothing read, and is waited out like a missing status.
            statuses="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status?per_page=100" \
              --jq '.statuses[] | "\(.context) \(.state)"')" || statuses=""
            red=""
            waiting=""
            for context in $required; do
              state="$(awk -v c="$context" '$1 == c { print $2; exit }' <<<"$statuses")"
              case "$state" in
                success) ;;
                failure | error) red="$red $context ($state)" ;;
                *) waiting="$waiting $context (${state:-no status})" ;;
              esac
            done
            if [ -n "$red" ]; then
              echo "::error::The suite did not pass on the Mac for $HEAD_SHA:$red. The status names its log."
              exit 1
            fi
            if [ -z "$waiting" ]; then
              for context in $required; do echo "$context: success on $HEAD_SHA"; done
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No passing status on $HEAD_SHA for:$waiting. Run scripts/validate-and-push.sh on buddybox at that commit; it runs the suites, posts their statuses and, when they pass, re-runs this job."
              exit 1
            fi
            echo "Waiting for:$waiting"
            sleep 15
          done

  # The review cap (docs/process.md, *The fix loop*): four Codex verdicts on a
  # PR and the reviewer does not run again. scripts/review-cap.sh counts them
  # the way scripts/review-prompt.sh counts the round (both read
  # scripts/review-verdicts.sh) and at four sets `capped`: codex_wait, and
  # with it codex, does not run, and reviewer_ran and review_gate read the cap
  # as neither a missing verdict nor a blocking one. review_gate stays red, so
  # automerge does not merge a capped PR: it merges on Sam's word, or goes
  # back to draft for a replan. The script posts one comment saying so, under
  # its own marker and never the codex one. A count it cannot read or a
  # comment it cannot post fails this job, so codex_wait does not run and
  # reviewer_ran reports it as re-runnable. post_feedback runs the same script
  # again immediately before it posts, which is the guard on the write side.
  #
  # This job and post_feedback check out `scripts/` alone to run the script,
  # with a token that can comment and no persisted credential: the PR's own
  # script runs with that token, which is the same-repo trust the header
  # accepts.
  #
  # It is also where the run learns whether the PR is a draft: read from the
  # API here, not from the event (see `concurrency` above), and handed on as
  # `draft`. On a draft nothing is counted, `capped` is empty, and codex_wait,
  # which runs only on `draft == 'false'` and `capped == 'false'`, is skipped.
  # A read that fails, or answers neither `true` nor `false`, fails the job.
  review_cap:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      draft: ${{ steps.draft.outputs.draft }}
      capped: ${{ steps.count.outputs.capped }}
    steps:
      - name: Read whether the PR is a draft now
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          draft="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .draft)"
          case "$draft" in
            true | false) ;;
            *)
              echo "::error::Could not read whether PR #$PR_NUMBER is a draft (answered: ${draft:-nothing}). Re-run the job."
              exit 1
              ;;
          esac
          echo "PR #$PR_NUMBER draft: $draft (the event said ${{ github.event.pull_request.draft }})"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.draft.outputs.draft == 'false'
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Count the Codex verdicts on this PR
        id: count
        if: steps.draft.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/review-cap.sh >> "$GITHUB_OUTPUT"

  # Codex runs the CLI in the runner with the repo checked out, so unlike a
  # single-shot reviewer it can open the file the diff only mentions. Its
  # verdict is a step exit code in review_gate below, which is what makes it a
  # gate rather than a comment.
  #
  # Skipped while the PR is a draft: an agent opens the PR as a draft, iterates
  # against the free local reviewer, and marks it ready — that transition is
  # what first spends a Codex round.
  #
  # It waits on `test`, so a suite that did not pass on the Mac spends no
  # reviewer round.
  # One codex job at a time across the repository: each spends the login it
  # starts from and writes the rotated one back, so two on the same login
  # break the chain. The wait is its own job because a job receives its
  # secrets when it starts: `codex` must start after the previous write-back,
  # not wait inside itself holding the login that write-back replaced.
  #
  # Queue order is this job's own start (then its id). It waits while another
  # run of this workflow has a `codex` job not yet completed, a `codex_wait`
  # that started earlier and is still in progress, or a `codex_wait` that
  # succeeded whose `codex` has not appeared yet. It polls every 20 seconds,
  # and after 25 minutes it warns and lets the review go ahead. An API error
  # counts as busy and is retried within the same bound.
  codex_wait:
    needs: [select, test, review_cap]
    if: >-
      !cancelled() &&
      needs.select.result == 'success' &&
      needs.test.result == 'success' &&
      needs.review_cap.outputs.draft == 'false' &&
      needs.review_cap.outputs.capped == 'false' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Read-only, to list this workflow's runs and their jobs.
      actions: read
    steps:
      - name: Wait for any other run's codex job to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          api="repos/$GITHUB_REPOSITORY/actions"
          me=$(gh api "$api/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "codex_wait")][0] | {id, started_at}' 2>/dev/null) || me=""
          if [ -z "$me" ] || [ "$me" = "null" ]; then
            echo "::warning::Could not find this codex_wait job in the API; the review goes ahead without waiting."
            exit 0
          fi
          deadline=$((SECONDS + 25 * 60))
          while :; do
            busy=""
            if runs=$(gh api "$api/workflows/pr-validate.yaml/runs?status=in_progress&per_page=100" \
                --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id"); then
              for r in $runs; do
                if ! jobs=$(gh api "$api/runs/$r/jobs?filter=latest&per_page=100"); then
                  busy="the jobs of run $r could not be read"
                  break
                fi
                why=$(jq -r --argjson me "$me" --arg r "$r" '
                  ([.jobs[] | select(.name == "codex")][0]) as $c
                  | ([.jobs[] | select(.name == "codex_wait")][0]) as $w
                  | if $c != null and $c.status != "completed" then "run \($r): codex is \($c.status)"
                    elif $w != null and $w.status == "in_progress"
                      and ([$w.started_at, $w.id] < [$me.started_at, $me.id]) then "run \($r): earlier in the queue"
                    elif $w != null and $w.conclusion == "success" and $c == null then "run \($r): codex about to start"
                    else empty end' <<<"$jobs")
                if [ -n "$why" ]; then busy="$why"; break; fi
              done
            else
              busy="this workflow's runs could not be listed"
            fi
            if [ -z "$busy" ]; then
              echo "No other codex job is running or ahead in the queue."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::Still waiting after 25 minutes ($busy); the review goes ahead, and may start on a login another job is about to rotate."
              exit 0
            fi
            echo "Waiting: $busy"
            sleep 20
          done

  codex:
    needs: [select, test, codex_wait]
    # Same-repo branches only: a fork PR carries untrusted content and must
    # never meet the login. (A fork PR then has no verdict, reviewer_ran and
    # review_gate go red, and it stays a human merge, made past the required
    # check with `gh pr merge --admin`.)
    #
    # `!cancelled()` in place of the implicit `success()`, so every
    # `needs.<job>.result` is spelled out — without them, a red `test` would
    # still spend a reviewer round. A draft is held by codex_wait, which ran
    # only if review_cap read the PR as ready.
    if: >-
      !cancelled() &&
      needs.select.result == 'success' &&
      needs.test.result == 'success' &&
      needs.codex_wait.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Read-only, for the PR's changed-file list in the scoping step.
      pull-requests: read
      # Read-only, for the previous Codex verdict the prompt step reads.
      issues: read
    outputs:
      has_verdict: ${{ steps.sanitise.outputs.has_verdict }}
    steps:
      - name: Join the tailnet, to reach the status pane
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' }}
        # Best-effort like the POST it enables: a Tailscale outage or an expired
        # OAuth client must not fail `codex` or the required `review_gate` and hold
        # a mergeable PR. Without this the status feed becomes a merge dependency.
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}

      - name: Tell the status pane the review is running
        env:
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          jq -nc --argjson pr "$PR" --arg branch "$BRANCH" --arg ts "$(date -u +%FT%TZ)" \
            '{pr: $pr, branch: $branch, state: "running", summary: "Codex review running", ts: $ts}' \
            | curl -sS -m 10 -X POST -H 'content-type: application/json' --data-binary @- "$STATUS_PANE_URL" \
            || echo "::warning::status pane unreachable"

      # This job holds read permissions and nothing more: the persisted token
      # is repo-scoped and cannot push, comment or merge. The jobs that comment
      # are separate ones, checking out scripts/ alone with no persisted
      # credential (review_cap, above).
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      # The merge ref moves with every push, while the verdict's second marker
      # records the event's head. A push landing between the event and the
      # checkout would have the reviewer read one commit and the verdict name
      # another, and the next re-review diff from the wrong boundary, so the
      # merge ref's second parent must be the event's head or nothing is
      # reviewed (the newer push's own run reviews it). The parent is read
      # from the raw commit, since the shallow checkout grafts HEAD parentless.
      # scripts/tests/review-prompt-test.sh runs this step out of this file.
      - name: The checkout is the event's head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merged="$(git cat-file -p HEAD | sed -n 's/^parent //p' | sed -n 2p)"
          if [ "$merged" != "$HEAD_SHA" ]; then
            echo "::error::The merge ref merges ${merged:-no second parent}, not this event's PR head $HEAD_SHA: a newer push moved it. This run reviews nothing; the newer push's run reviews that."
            exit 1
          fi
          echo "The merge ref merges the event's PR head, $HEAD_SHA."

      - name: Pre-fetch base and head refs for the PR
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      # The prompt, assembled by scripts/review-prompt.sh before the login is
      # on disk: the instructions below, the PR description, and — when this
      # PR has an earlier Codex verdict naming the head it read — that verdict
      # and the PR's own commits from that head to this run's PR head, with
      # the instruction to verify each earlier finding and then read the
      # whole PR again. Anything missing or unusable there is a first review,
      # said in this step's log; a `gh` that cannot read the PR's comments
      # after its retries fails the step, so the job errors and is re-run
      # rather than reviewing under a guessed round.
      # scripts/tests/review-prompt-test.sh holds it.
      - name: Assemble the review prompt
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The PR head this run reviews, never the merge ref the checkout is on.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The base the PR merges into: its commits are not the fix's.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PROMPT: |
            Review PR #${{ github.event.pull_request.number }} in this
            repository. Review ONLY the changes it introduces.

            Be exhaustive. This is the one read the PR gets before it merges:
            report every finding that meets the evidence rule below, not the
            first few, ranked most serious first with the blocking ones
            first. A defect left for a later round costs a full CI run and a
            fix round to find.

            The question you answer is: does the code do what the PR
            description says it does, and does the evidence it claims hold?
            Read the project's CLAUDE.md for general context, and read
            docs/design.md for invariants the diff will not spell out.

            Attack the description's claims. For each thing it says was done,
            find the input, state or ordering that makes the code not do it;
            for each thing its Proof section says was verified, check that the
            test actually fails when the behaviour is wrong. A test that
            cannot fail is a finding. A claim with no test behind it is a
            finding.

            Evidence rule: every finding cites `path:line` and names the
            concrete input or sequence that breaks the claim. A finding with
            neither is reported as low-confidence — say so in its text — and
            never blocks.

            The suites this change needs have already passed on a Mac at the
            commit under review; this runner has no Swift
            toolchain and your sandbox is read-only; do not try to build or run
            anything — review the tests by reading them. You can read any file
            in the checkout; do that rather than guessing. Skip style and
            formatting; report only what would actually break something, and
            say plainly if you find nothing.

            Review the diff, not the repository. A defect in a file the PR
            does not touch is not this PR's to fix: mention it in `summary`
            as pre-existing, never as a blocking finding. In particular the
            workflows under `.github/workflows/` run PR-authored code with a
            reviewer credential and a write token for same-repository
            branches; that exposure is accepted by design, documented in this
            file's header, and is not a finding on any PR that does not
            change those workflows.

            Return JSON matching the schema. Set `blocking` true only for a
            finding that meets the evidence rule and would break at runtime,
            make the description untrue, lose or corrupt a record, split the
            primary, leak a secret, or ship code the licence forbids.
            `summary` is what a reader sees; `findings` is one string per
            issue.

            If you cannot complete the review — the checkout is unreadable,
            the diff will not load, anything that stops you reading — set
            `blocking` true and say why in `summary`. A review you could not
            do is not a clean review. A build or test command the sandbox
            refuses is not that: you review by reading, and every file you
            need is in the checkout.

        run: |
          set -euo pipefail
          scripts/review-prompt.sh > "$RUNNER_TEMP/prompt.txt"
          if grep -q '^----- PREVIOUS REVIEW AND THE CHANGE SINCE -----$' "$RUNNER_TEMP/prompt.txt"; then
            echo "The prompt carries the previous-review section."
          else
            echo "The prompt carries no previous-review section: a first review."
          fi

      - name: Write the Codex login
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::CODEX_AUTH_JSON secret is unset; the reviewer has no login."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/codex-home"
          chmod 700 "$RUNNER_TEMP/codex-home"
          printf '%s' "$CODEX_AUTH_JSON" > "$RUNNER_TEMP/codex-home/auth.json"
          chmod 600 "$RUNNER_TEMP/codex-home/auth.json"
          jq -e '.auth_mode == "chatgpt" and (.tokens.access_token | type) == "string"' \
            "$RUNNER_TEMP/codex-home/auth.json" >/dev/null \
            || { echo "::error::CODEX_AUTH_JSON is not a chatgpt-mode codex auth.json."; exit 1; }

      # The Codex CLI directly rather than openai/codex-action: the action
      # unconditionally waits on the Responses proxy its API-key path starts,
      # so it cannot run on a ChatGPT login. `codex exec` reads the login from
      # $CODEX_HOME/auth.json on its own.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Codex CLI
        run: npm install -g @openai/codex && codex --version

      # The CLI's read-only sandbox is bubblewrap, and Ubuntu 24.04 runners
      # block unprivileged user namespaces via AppArmor (bwrap fails with
      # `loopback: Failed RTM_NEWADDR: Operation not permitted`). Same fix
      # openai/codex-action applies on hosted Linux runners.
      - name: Enable user namespaces for the Codex sandbox
        run: |
          set -euo pipefail
          if [ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo 1)" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Codex
        id: run_codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_MODEL: gpt-6-sol
          # A verdict the workflow can act on. Free prose can only be posted;
          # a schema makes "does this block the merge" a field.
          OUTPUT_SCHEMA: |
            {"type": "object", "additionalProperties": false, "properties": {"blocking": {"type": "boolean"}, "summary": {"type": "string"}, "findings": {"type": "array", "items": {"type": "string"}}}, "required": ["blocking", "summary", "findings"]}
        run: |
          set -euo pipefail
          printf '%s' "$OUTPUT_SCHEMA" > "$RUNNER_TEMP/schema.json"
          # read-only: the reviewer's tool commands get no network and no
          # writes, so a prompt-injected `curl` of the login has nowhere to go.
          # The model call itself is made by the codex process, outside the
          # sandbox.
          codex exec < "$RUNNER_TEMP/prompt.txt" \
            --model "$CODEX_MODEL" \
            --sandbox read-only \
            --skip-git-repo-check \
            --color never \
            --output-schema "$RUNNER_TEMP/schema.json" \
            --output-last-message "$RUNNER_TEMP/verdict.json" \
            -

      # The diff-scope rule from the header. Writes `scoped.json`, which the
      # sanitise step below is the only reader of: a valid verdict leaves here
      # with its findings split into `findings` (kept) and `demoted` (cite only
      # unchanged files), plus `codex_blocking` recording what Codex itself
      # said; anything that is not a valid verdict leaves here verbatim.
      - name: Scope the verdict to the diff
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERDICT_PATH: ${{ runner.temp }}/verdict.json
        run: |
          set -euo pipefail
          # Renames list under their new name; the old name counts as changed
          # too so a finding citing either spelling stays in scope.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          echo "Changed files:"; sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          git ls-files -z > "$RUNNER_TEMP/repo-files.txt"
          python3 - "$VERDICT_PATH" "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/repo-files.txt" > "$RUNNER_TEMP/scoped.json" <<'PY'
          import json, re, sys

          verdict_path, changed_path, repo_path = sys.argv[1:4]
          raw = open(verdict_path).read()
          try:
              v = json.loads(raw)
              ok = (isinstance(v, dict) and isinstance(v.get("blocking"), bool)
                    and isinstance(v.get("summary"), str) and isinstance(v.get("findings"), list)
                    and all(isinstance(f, str) for f in v["findings"]))
          except ValueError:
              ok = False
          if not ok:
              print("verdict is not a valid {blocking, summary, findings}; passing it through unscoped", file=sys.stderr)
              sys.stdout.write(raw)
              sys.exit(0)

          changed = {l.strip() for l in open(changed_path) if l.strip()}
          repo = {p for p in open(repo_path).read().split("\0") if p}

          # A cite is `path:line` anywhere, or anything in backticks. Both are
          # only candidates: one that does not resolve to a file in the checkout
          # (a symbol, an example filename) is not a citation.
          CITE = re.compile(r"`([^`\n]+)`|((?<![\w./-])[\w./-]+\.\w+:\d+)")
          PATHISH = re.compile(r"^\.?/?[\w./-]+$")

          def resolve(cand):
              cand = re.sub(r":\d+(?:[-–]\d+)?\s*$", "", cand.strip())
              cand = re.sub(r"^\./", "", cand)
              if not cand or not PATHISH.match(cand):
                  return []
              if cand in repo:
                  return [cand]
              return sorted(f for f in repo if f.endswith("/" + cand))

          kept, demoted = [], []
          for f in v["findings"]:
              cited = set()
              for m in CITE.finditer(f):
                  cited.update(resolve(m.group(1) or m.group(2)))
              hit = sorted(cited & changed)
              if cited and not hit:
                  demoted.append(f)
                  print(f"demoted (cites only unchanged files {sorted(cited)}): {f[:120]}", file=sys.stderr)
              else:
                  kept.append(f)
                  print(f"kept (cites {hit or 'no repo file'}): {f[:120]}", file=sys.stderr)

          out = dict(v)
          out["codex_blocking"] = v["blocking"]
          out["findings"] = kept
          out["demoted"] = demoted
          if v["blocking"] and demoted and not kept:
              out["blocking"] = False
              print("every finding cites only unchanged files; verdict is now non-blocking", file=sys.stderr)
          json.dump(out, sys.stdout)
          PY

      # Anyone who can read the repository can download an artifact, so every
      # registered secret's value is replaced with `***` in the verdict's text
      # fields before the file leaves this job. The structural fields are left
      # alone — no secret's value is a boolean — so the gate decides the same on
      # the sanitised file as on the one the scoping step wrote. A verdict that
      # is not JSON is sanitised as text and leaves `has_verdict` false, which
      # is the no-verdict path.
      - name: Sanitise the verdict
        id: sanitise
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          SCOPED_PATH: ${{ runner.temp }}/scoped.json
          VERDICT_OUT: ${{ runner.temp }}/codex-verdict/verdict.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$VERDICT_OUT")"
          python3 - "$SCOPED_PATH" "$VERDICT_OUT" <<'PY'
          import json, os, sys

          # The secrets this workflow registers. A name with no value in the
          # environment contributes nothing.
          NAMES = ("CODEX_AUTH_JSON", "TS_OAUTH_CLIENT_ID", "TS_OAUTH_SECRET", "GITHUB_TOKEN")

          src, dst = sys.argv[1:3]
          raw = open(src).read()
          values = [v for v in (os.environ.get(n, "") for n in NAMES) if v]

          def clean(s):
              for v in values:
                  s = s.replace(v, "***")
              return s

          try:
              v = json.loads(raw)
          except ValueError:
              v = None
          if isinstance(v, dict):
              if isinstance(v.get("summary"), str):
                  v["summary"] = clean(v["summary"])
              for key in ("findings", "demoted"):
                  if isinstance(v.get(key), list):
                      v[key] = [clean(f) if isinstance(f, str) else f for f in v[key]]
              text = json.dumps(v)
          else:
              text = clean(raw)
          with open(dst, "w") as out:
              out.write(text)
          PY
          if [ -s "$VERDICT_OUT" ] && jq -e . "$VERDICT_OUT" >/dev/null 2>&1; then
            echo "has_verdict=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_verdict=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The reviewer answered with nothing usable as a verdict; review_gate will fail closed. What it said, sanitised:"
            head -c 2000 "$VERDICT_OUT" || true
          fi

      # `overwrite` so a re-run of this job alone replaces the last attempt's
      # file rather than being refused for a name that already exists.
      - name: Upload the verdict
        uses: actions/upload-artifact@v4
        with:
          name: codex-verdict
          path: ${{ runner.temp }}/codex-verdict/verdict.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      # The CLI rotates the refresh token on its first use, so the login it
      # leaves in codex-home is the only live one and the secret it started
      # from is spent. Writing it back is what lets the next job sign in. It
      # runs on failure and cancellation too: a rotation happens whether or not
      # the review finished. The file is compared and piped, never printed.
      - name: Write the rotated Codex login back to the secret
        if: ${{ always() }}
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.CODEX_SECRET_PAT }}
        run: |
          set -euo pipefail
          auth="$RUNNER_TEMP/codex-home/auth.json"
          if [ ! -f "$auth" ]; then
            echo "No Codex login on the runner; nothing to write back."
            exit 0
          fi
          if ! jq -e '.auth_mode == "chatgpt" and (.tokens.access_token | type) == "string"' \
            "$auth" >/dev/null 2>&1; then
            echo "::warning::The Codex login on the runner is not a chatgpt-mode auth.json; the secret is left as it is."
            exit 0
          fi
          if [ -n "$CODEX_AUTH_JSON" ] \
            && [ "$(jq -cS . "$auth")" = "$(printf '%s' "$CODEX_AUTH_JSON" | jq -cS . 2>/dev/null || true)" ]; then
            echo "The Codex login is unchanged; nothing to write back."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The Codex login rotated but CODEX_SECRET_PAT is unset, so CODEX_AUTH_JSON is now spent. Set CODEX_SECRET_PAT (a fine-grained PAT on this repository with Secrets: write), then mint a new login with codex login."
            exit 1
          fi
          # One line, for the same reason as the header's: every line of a
          # multi-line secret is registered as a secret value of its own.
          jq -c . "$auth" | gh secret set CODEX_AUTH_JSON -R "$GITHUB_REPOSITORY"
          echo "Wrote the rotated Codex login back to CODEX_AUTH_JSON."

      - name: Delete the Codex login
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/codex-home"

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    # `!cancelled()` in place of the implicit `success()`, as on codex, so the
    # verdict Codex gave never stays in an artifact with nothing on the PR.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.codex.outputs.has_verdict == 'true' }}
    permissions:
      # Read-only on Actions, for the verdict artifact from this same run.
      actions: read
      # Read-only, to check out scripts/ for the recount.
      contents: read
      issues: write
      pull-requests: write
    outputs:
      capped: ${{ steps.recount.outputs.capped }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # The cap again, immediately before the write: review_cap counted at the
      # start of the run, and a run in flight — one cancelled mid-post among
      # them — can have landed a verdict since. At the cap this run's verdict
      # is not posted; the cap comment is, and reviewer_ran and review_gate
      # read this job's `capped` as they read review_cap's.
      - name: Recount the Codex verdicts before posting
        id: recount
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/review-cap.sh >> "$GITHUB_OUTPUT"
      - name: Download the verdict
        uses: actions/download-artifact@v4
        with:
          name: codex-verdict
          path: ${{ runner.temp }}/codex-verdict
      - name: Report Codex feedback
        if: ${{ steps.recount.outputs.capped == 'false' }}
        uses: actions/github-script@v7
        env:
          CODEX_VERDICT_PATH: ${{ runner.temp }}/codex-verdict/verdict.json
          # The PR head this verdict read, which the next run's prompt step
          # diffs from.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const v = JSON.parse(require('fs').readFileSync(process.env.CODEX_VERDICT_PATH, 'utf8'))
            const lines = [v.summary, ...(v.findings ?? []).map(f => `- ${f}`)]
            if (v.blocking) {
              lines.unshift('**Blocking — this merge is held until these are addressed or overridden.**', '')
            } else if (v.codex_blocking) {
              lines.unshift('Codex marked this blocking, but every finding cites only files this PR does not change, so the gate treats it as non-blocking.', '')
            }
            if (v.demoted?.length) {
              lines.push('', '**Pre-existing, not blocking** — these cite only files this PR does not change:',
                ...v.demoted.map(f => `- ${f}`))
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              // The first line is what the githubpr channel matches on to
              // deliver this review back to the session that opened the PR.
              // Changing it does not break the review; it breaks the fix loop,
              // silently. The second names the PR head this verdict read, which
              // scripts/review-prompt.sh diffs the next review from.
              body: `<!-- agent-review: codex -->\n<!-- agent-review-sha: ${process.env.HEAD_SHA} -->\n### Codex review\n\n${lines.join('\n')}`,
            })

  # "The reviewer said no" and "there is no verdict" are different answers, and
  # one red check cannot say which. So the gate is two jobs, and *which one is
  # red* is the diagnosis:
  #
  #   reviewer_ran   red  ⇒ no verdict exists. Infrastructure or a draft.
  #                         Re-runnable; not a statement about the code.
  #                         With the reviewer job not concluded `success`,
  #                         review_gate is red beside it and adds nothing: it
  #                         is a required check on main, and one that passed
  #                         with no verdict would let the PR past branch
  #                         protection on its own, whatever this run concluded.
  #                         (post_feedback red beside a reviewer that did
  #                         conclude leaves reviewer_ran red too, and
  #                         review_gate then says what the verdict was.)
  #   review_gate    red, reviewer_ran green
  #                       ⇒ the reviewer ran and its verdict blocks, or it
  #                         answered with nothing usable. A review decision.
  #                         Or, with reviewer_ran green and no verdict posted
  #                         this run, the review cap: Sam's word or a replan,
  #                         not a fix round.
  #
  # Readable without opening a log:
  #   gh api repos/OWNER/REPO/actions/runs/RUNID/jobs \
  #     -q '.jobs[]|"\(.name): \(.conclusion) steps=\(.steps|length)"'
  #
  # Both fail closed and neither can be skipped into green. automerge merges
  # only on this workflow concluding `completed success`, so either job red
  # holds the merge — and a `cancelled` or `skipped` conclusion holds it too:
  # concurrency cancels a superseded run, `!cancelled()` skips both jobs, and
  # the run concludes `cancelled` rather than red.
  #
  reviewer_ran:
    needs: [select, test, review_cap, codex, post_feedback]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert a verdict was produced and delivered
        env:
          # review_cap's reading of the PR as the run started. Only where
          # review_cap was skipped, a fork PR, is the event's own word used:
          # a review_cap that failed leaves this empty, and is said first.
          IS_DRAFT: ${{ needs.review_cap.result == 'skipped' && github.event.pull_request.draft || needs.review_cap.outputs.draft }}
          SUITE_RESULTS: >-
            select=${{ needs.select.result }}
            test=${{ needs.test.result }}
          CAP_RESULT: ${{ needs.review_cap.result }}
          CAPPED: ${{ needs.review_cap.outputs.capped == 'true' || needs.post_feedback.outputs.capped == 'true' }}
          CODEX_RESULT: ${{ needs.codex.result }}
          FEEDBACK_RESULT: ${{ needs.post_feedback.result }}
        run: |
          set -euo pipefail

          # A review_cap that failed is no verdict, and comes first: it may
          # not have read whether the PR is a draft, and the event's word
          # for that is not to be believed in its place. Nor is the cap
          # known, or its comment on the PR. A fork PR skips review_cap as
          # it skips codex, and the reviewer's own line below says that.
          case "${CAP_RESULT:-}" in
            failure | cancelled)
              echo "::error::No verdict: whether this PR is a draft could not be read, or its Codex verdicts not counted, or the cap comment not posted (review_cap: $CAP_RESULT), so the reviewer did not run. Re-run the failed jobs — nothing here is a review decision."
              exit 1
              ;;
          esac
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error::No verdict: this PR is a draft, so the reviewer was deliberately skipped. Mark it ready for review — nothing here is a review decision."
            exit 1
          fi
          # The cap is a review state, not a missing verdict: review_gate holds
          # the merge on it, and a red here would have the janitor rerun it.
          # The suite's own reds stay on `test`.
          if [ "${CAPPED:-}" = "true" ]; then
            echo "The review cap is reached, so the reviewer was deliberately not run; review_gate holds the merge for Sam's word or a replan."
            exit 0
          fi
          # Named before the reviewer's own result, because a red `test` is
          # why the reviewer did not run and "the reviewer job did not
          # complete" would send a reader to the wrong log.
          red=""
          for pair in $SUITE_RESULTS; do
            job="${pair%%=*}"; result="${pair#*=}"
            [ "$result" = success ] && continue
            red="$red $job ($result)"
          done
          if [ -n "$red" ]; then
            echo "::error::Not mergeable: the suite did not pass —$red — so the reviewer was deliberately not spent on it (codex: $CODEX_RESULT, post_feedback: $FEEDBACK_RESULT). The \`test\` job says which status is missing or red — nothing here is a review decision."
            exit 1
          fi
          if [ "$CODEX_RESULT" != "success" ]; then
            echo "::error::No verdict: the reviewer job did not complete (result: $CODEX_RESULT). Re-run the failed jobs — nothing here is a review decision."
            exit 1
          fi

          # Past this point the reviewer ran, so whatever it returned — a
          # verdict or nothing usable — is review_gate's to judge. A *skipped*
          # post_feedback is not a failure here: the job is gated on
          # `has_verdict`, so skipped means the reviewer answered with nothing
          # usable, and that is a review outcome this job must not relabel as
          # infrastructure. Only an outright failure or cancellation is: a
          # verdict existed and never reached the PR.
          case "$FEEDBACK_RESULT" in
            failure | cancelled)
              echo "::error::No verdict delivered: the reviewer answered but post_feedback did not post it (result: $FEEDBACK_RESULT). Re-run the failed jobs — nothing here is a review decision."
              exit 1
              ;;
          esac

          echo "The reviewer ran; its answer is review_gate's to enforce."

  # The verdict, and deliberately after post_feedback: a blocking verdict must
  # still reach the PR (and through it the session) before it fails the run.
  #
  # It is red whenever the reviewer job did not conclude `success`: branch
  # protection reads this job, not the run, so it must not pass on a head whose
  # reviewer produced no verdict — a reviewer that failed after an earlier
  # blocking verdict, or after uploading this one, included. reviewer_ran says
  # why there is none; the guard below names the split as broken if
  # reviewer_ran passed with no verdict.
  #
  # This is a required status check on main, beside `test`.
  review_gate:
    needs: [reviewer_ran, select, test, review_cap, codex, post_feedback]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only on Actions, for the verdict artifact from this same run.
      actions: read
    steps:
      # Only when there is one to download. The job's own guard stays
      # `!cancelled()`, so a false or absent flag still reaches the checks
      # below with no verdict in hand, which is what they fail closed on.
      - name: Download the verdict
        if: ${{ needs.codex.outputs.has_verdict == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: codex-verdict
          path: ${{ runner.temp }}/codex-verdict
      - name: Enforce the review verdict
        id: verdict
        env:
          PRECHECK_RESULT: ${{ needs.reviewer_ran.result }}
          CAPPED: ${{ needs.review_cap.outputs.capped == 'true' || needs.post_feedback.outputs.capped == 'true' }}
          CODEX_RESULT: ${{ needs.codex.result }}
          HAS_VERDICT: ${{ needs.codex.outputs.has_verdict }}
          VERDICT_FILE: ${{ runner.temp }}/codex-verdict/verdict.json
        run: |
          set -euo pipefail

          # The verdict is the artifact's one file. No flag, or a flag with no
          # readable file behind it, leaves this empty — which is no verdict,
          # and falls into the fail-closed case at the bottom.
          VERDICT=""
          if [ "${HAS_VERDICT:-}" = "true" ]; then
            if [ -s "$VERDICT_FILE" ]; then
              VERDICT="$(cat "$VERDICT_FILE")"
            else
              echo "::error::The reviewer reported a verdict but $VERDICT_FILE is missing or empty."
            fi
          fi

          # Everything below records the outcome for the status-pane step, then
          # exits with it; `state` is pass|block, `summary` is the verdict's
          # summary, which a re-review writes as several lines (its list of
          # earlier findings), so it goes to the output file as a delimited
          # block and never as `summary=` on one line, which the runner
          # refuses for a value with a newline in it and fails the step. The
          # block's delimiter is random per call, since the summary is the
          # reviewer's text and a fixed delimiter is a line it could contain,
          # which would end the block early and fail the step on what follows.
          finish() {
            local eom
            eom="TOPO_SUMMARY_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            { echo "state=$1"; echo "summary<<$eom"; echo "$2"; echo "$eom"; } >> "$GITHUB_OUTPUT"
            exit "$3"
          }

          # The review cap: four verdicts, and the reviewer deliberately not run
          # again. Not a pass, so the merge is held; not a fresh block, so
          # nothing here is a finding to fix. The status pane has no state for
          # it, so it reads as block with the cap for its summary.
          if [ "${CAPPED:-}" = "true" ]; then
            echo "::error::Review cap reached: this PR carries four Codex verdicts and is not reviewed again. It merges on Sam's word, or goes back to draft for a replan — not a new review decision."
            finish block "review cap reached: four Codex verdicts; merges on Sam's word or goes back to draft for a replan" 1
          fi

          if [ "$CODEX_RESULT" != "success" ]; then
            # No verdict exists, so there is no review decision to report and
            # this check must not read as one. reviewer_ran owns the reason, and
            # if it is green here the split has broken: this job fails either
            # way, and says which.
            if [ "$PRECHECK_RESULT" = "success" ]; then
              echo "::error::No verdict exists (reviewer: $CODEX_RESULT) but reviewer_ran passed. The gate split is broken; failing closed."
              finish block "gate split broken: no verdict but reviewer_ran passed" 1
            fi
            echo "::error::No verdict exists (reviewer job: $CODEX_RESULT), so this head is not reviewed and does not pass. Not a review decision — see the reviewer_ran check for why."
            finish block "no verdict: reviewer job $CODEX_RESULT (see reviewer_ran)" 1
          fi

          # The CLI's last message is whatever it emitted; nothing checks it
          # against the schema. So a reviewer that answered in prose, or
          # with JSON of the wrong shape, reaches here — and reading `.blocking`
          # off it with a bare `jq` inside an `if` yields the empty string, which
          # is not "true", which reads as a clean review. Demand all three
          # required fields and treat everything else as no verdict at all.
          blocking="$(jq -r 'if type == "object" and (.blocking | type) == "boolean" and (.summary | type) == "string" and (.findings | type) == "array" then .blocking else "invalid" end' <<<"$VERDICT" 2>/dev/null || echo invalid)"
          summary="$(jq -r '.summary? // "" | .[0:300]' <<<"$VERDICT" 2>/dev/null || true)"

          # A reviewer that gave up but still answered `blocking: false` — the
          # prompt tells it to block instead, but the gate does not trust the
          # prompt: no findings and a summary that opens with an admission of
          # failure is no verdict, not a pass.
          gave_up="$(jq -r 'if .blocking == false and (.findings | length) == 0 and (.summary | test("^\\s*(unable|not able|could ?n.t|cannot|can.t|failed|i was unable|i could not|i cannot|did not complete|couldn)"; "i")) then "true" else "false" end' <<<"$VERDICT" 2>/dev/null || echo false)"

          case "$blocking" in
            false)
              if [ "$gave_up" = "true" ]; then
                echo "::error::The reviewer reported it could not complete the review; that is no verdict, not a pass."
                jq -r '.summary' <<<"$VERDICT"
                finish block "reviewer could not complete the review: $summary" 1
              fi
              echo "Review verdict: not blocking."
              if [ "$(jq -r '.codex_blocking? // false' <<<"$VERDICT")" = "true" ]; then
                echo "Codex answered blocking; every finding was demoted as pre-existing (cites only files this PR does not change):"
                jq -r '.demoted[]? // empty' <<<"$VERDICT" | sed 's/^/  - /'
              fi
              finish pass "$summary" 0
              ;;
            true)
              echo "::error::Review is blocking. See the Codex review comment on the PR."
              # `.findings[]` on a verdict without the key exits 5 under pipefail
              # and aborts the gate before it can name the reason.
              jq -r '.findings[]? // empty' <<<"$VERDICT" | sed 's/^/  - /'
              finish block "$summary" 1
              ;;
            *)
              # The reviewer ran to completion and answered with nothing usable.
              # Not re-runnable infrastructure: the reviewer answered, and this
              # is what it said.
              echo "::error::The reviewer ran but returned no usable verdict. Not re-runnable infrastructure — the reviewer answered, and this is what it said:"
              printf '%s\n' "$VERDICT" | head -c 2000
              finish block "reviewer returned no usable verdict" 1
              ;;
          esac

      - name: Join the tailnet, to reach the status pane
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' }}
        # Best-effort like the POST it enables: a Tailscale outage or an expired
        # OAuth client must not fail `codex` or the required `review_gate` and hold
        # a mergeable PR. Without this the status feed becomes a merge dependency.
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}

      - name: Tell the status pane the verdict
        if: ${{ always() }}
        env:
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          STATE: ${{ steps.verdict.outputs.state || 'block' }}
          SUMMARY: ${{ steps.verdict.outputs.summary || 'review_gate did not reach a verdict' }}
        run: |
          jq -nc --argjson pr "$PR" --arg branch "$BRANCH" --arg state "$STATE" --arg summary "$SUMMARY" --arg ts "$(date -u +%FT%TZ)" \
            '{pr: $pr, branch: $branch, state: $state, summary: $summary, ts: $ts}' \
            | curl -sS -m 10 -X POST -H 'content-type: application/json' --data-binary @- "$STATUS_PANE_URL" \
            || echo "::warning::status pane unreachable"
