# PROBE — do not merge. Can Apple's on-device recogniser run in the hosted runner's simulator?
name: PR validate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe-apple:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Host speech state, as found
        run: |
          sw_vers; xcodebuild -version
          for d in com.apple.assistant.support com.apple.Siri com.apple.speech.recognition.AppleSpeechServer com.apple.HIToolbox com.apple.SpeechRecognitionCore; do echo "== defaults read $d"; defaults read $d 2>&1 | head -40; done
          echo "== /System/Library/AssetsV2 (speech/siri/dictation)"; ls /System/Library/AssetsV2 | grep -i "speech\|siri\|dictation\|asr" || echo none
          echo "== ~/Library/Assets*"; ls -d ~/Library/Assets* 2>&1; ls ~/Library/Assets*/ 2>&1 | head -20
          echo "== daemons"; pgrep -lf "assistantd|localspeechrecognition|corespeechd|SpeechRecognitionCore|speechrecognitiond|mobileassetd|siriknowledged|dictationd" || echo none
          swift scripts/probe/host-speech.swift || true
      - name: Build for testing
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -project Topo.xcodeproj -scheme Topo -destination "platform=iOS Simulator,id=$udid" -derivedDataPath build/dd -quiet
      - name: Audio loopback with the fixture looping
        run: |
          set -euo pipefail
          brew install --quiet blackhole-2ch switchaudio-osx
          sudo killall coreaudiod
          for _ in $(seq 30); do SwitchAudioSource -a -t input | grep -qx "BlackHole 2ch" && break; sleep 1; done
          SwitchAudioSource -t input -s "BlackHole 2ch"; SwitchAudioSource -t output -s "BlackHole 2ch"
          nohup bash -c 'while true; do afplay Tests/Fixtures/purple-elephants.wav; done' >/dev/null 2>&1 &
          echo "TEST_RUNNER_TOPO_UITEST_AUDIO_INPUT=1" >> "$GITHUB_ENV"
      - name: Round 1 (as found) — fallback UI test, then the recogniser probe
        continue-on-error: true
        run: |
          xcodebuild test-without-building -project Topo.xcodeproj -scheme Topo -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/dd -only-testing:TopoUITests/MicrophonePressTests/testAPressOnTheFallbackDeliversAudioToTheRecogniser 2>&1 | grep -E "\[microphone\]|error: -|Test skipped|Test Case .*(passed|failed|skipped)"
          xcodebuild test-without-building -project Topo.xcodeproj -scheme Topo -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/dd -only-testing:TopoTests/AppleRecogniserProbeTests 2>&1 | grep -E "\[apple-probe\]|error: -|Test Case .*(passed|failed|skipped)"
      - name: Simulator speech assets
        run: |
          D=~/Library/Developer/CoreSimulator/Devices/$UDID/data
          ls $D/private/var/MobileAsset/AssetsV2 | grep -i "speech\|siri\|dictation\|asr" || echo none
          find $D/private/var/MobileAsset/AssetsV2 -name mini.json -exec ls -la {} \; 2>/dev/null | head
          f=$(find $D/private/var/MobileAsset/AssetsV2 -name mini.json | head -1); [ -n "$f" ] && { ls -la "$(dirname "$f")"; head -c 2000 "$f"; echo; }
          RR="$(xcrun simctl runtime list -v 2>/dev/null | awk -F': ' '/Bundle Path: .*iOS/{print $2; exit}')/Contents/Resources/RuntimeRoot"
          echo "runtime root: $RR"; ls "$RR/System/Library/PrivateFrameworks" | grep -i "speech\|^EAR\|dictation" | tr '\n' ' '; echo
      - name: Enable Dictation and Siri on the host, restart speech daemons, install assets
        run: |
          set -x
          defaults write com.apple.assistant.support "Dictation Enabled" -bool true
          defaults write com.apple.assistant.support "Assistant Enabled" -bool true
          defaults write com.apple.assistant.support "Siri Data Sharing Opt-In Status" -int 2
          defaults write com.apple.Siri StatusMenuVisible -bool true
          defaults write com.apple.Siri VoiceTriggerUserEnabled -bool false
          defaults write com.apple.speech.recognition.AppleSpeechServer DictationIMIntroMessagePresented -bool true
          defaults write com.apple.HIToolbox AppleDictationAutoEnable -int 1
          for p in assistantd localspeechrecognition corespeechd SpeechRecognitionCore speechrecognitiond siriknowledged; do killall "$p" 2>/dev/null && echo "restarted $p"; done
          sleep 5
          pgrep -lf "assistantd|localspeechrecognition|corespeechd|SpeechRecognitionCore" || echo none
          timeout 700 swift scripts/probe/host-speech.swift --install || echo "host install exited $?"
          ls /System/Library/AssetsV2 | grep -i "speech\|siri\|dictation\|asr" || echo none
          xcrun simctl shutdown "$UDID" || true
      - name: Round 2 (host enabled, simulator rebooted) — fallback UI test, then the recogniser probe
        continue-on-error: true
        run: |
          xcodebuild test-without-building -project Topo.xcodeproj -scheme Topo -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/dd -only-testing:TopoUITests/MicrophonePressTests/testAPressOnTheFallbackDeliversAudioToTheRecogniser 2>&1 | grep -E "\[microphone\]|error: -|Test skipped|Test Case .*(passed|failed|skipped)"
          xcodebuild test-without-building -project Topo.xcodeproj -scheme Topo -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/dd -only-testing:TopoTests/AppleRecogniserProbeTests 2>&1 | grep -E "\[apple-probe\]|error: -|Test Case .*(passed|failed|skipped)"
          xcodebuild test-without-building -project Topo.xcodeproj -scheme Topo -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/dd -only-testing:TopoUITests/MicrophonePressTests/testAPressOnTheFallbackDeliversAudioToTheRecogniser 2>&1 | grep -E "\[microphone\]|error: -|Test skipped|Test Case .*(passed|failed|skipped)"
