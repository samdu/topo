# PROBE — do not merge. What audio input does the hosted macos-26 runner's simulator have?
name: PR validate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Host audio, as found
        run: |
          set -x
          sw_vers; uname -m; xcodebuild -version
          system_profiler SPAudioDataType || true
          brew install switchaudio-osx
          SwitchAudioSource -a -t input || true
          SwitchAudioSource -a -t output || true
          SwitchAudioSource -c -t input || true
          SwitchAudioSource -c -t output || true
          sudo -n true && echo "passwordless sudo: yes"
          say -o /tmp/fixture.aiff "purple elephants juggle seven lanterns" && afconvert -f WAVE -d LEI16@16000 -c 1 /tmp/fixture.aiff /tmp/fixture.wav && afinfo /tmp/fixture.wav
          swiftc -O scripts/probe/record.swift -o /tmp/record && /tmp/record || true
      - name: Build for testing
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -project Topo.xcodeproj -scheme Topo -destination "platform=iOS Simulator,id=$udid" -derivedDataPath build/dd -quiet
      - name: UI test, host audio as found
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Topo.xcodeproj -scheme Topo -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/dd -only-testing:TopoUITests 2>&1 | tee /tmp/ui1.log | grep -E "mic-probe|error|Test Case|passed|failed" || true
          xcrun simctl shutdown "$UDID" || true
      - name: Install BlackHole loopback as default input and output
        run: |
          set -x
          brew install blackhole-2ch
          sudo killall coreaudiod || true
          sleep 8
          SwitchAudioSource -a -t input || true
          SwitchAudioSource -t input -s "BlackHole 2ch"
          SwitchAudioSource -t output -s "BlackHole 2ch"
          SwitchAudioSource -c -t input; SwitchAudioSource -c -t output
          system_profiler SPAudioDataType || true
          (while true; do afplay /tmp/fixture.wav; sleep 0.3; done) &
          echo $! > /tmp/afplay.pid
          /tmp/record || true
      - name: UI test, BlackHole looping the fixture
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Topo.xcodeproj -scheme Topo -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/dd -only-testing:TopoUITests 2>&1 | tee /tmp/ui2.log | grep -E "mic-probe|error|Test Case|passed|failed" || true
          kill "$(cat /tmp/afplay.pid)" || true
          xcrun simctl shutdown "$UDID" || true
