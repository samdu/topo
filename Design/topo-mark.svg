<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Topo</title>
  <!-- The Topo mark: a filled round head over eight curling arms, countable
       at icon size. One mind, eight limbs. No two arms are the same length:
       the hem they make is uneven, which is what stops eight mirrored pairs
       reading as a machine part. Drawn in currentColor so it can be white on
       the stone ground of an app icon and teal on a screen.
       This file is the source: Design/make-icons.swift reads it. -->
  <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M29.9 48.3 C 27.1 59.5, 21.6 65.1, 12.2 65.1 C 6.6 65.1, 6.6 57.6, 12.2 57.6" />
    <path d="M36.0 50.3 C 34.2 61.5, 27.6 69.0, 20.2 74.6 C 15.5 78.3, 19.2 83.8, 23.9 81.0" />
    <path d="M42.1 52.4 C 41.4 60.9, 37.8 67.0, 34.2 73.0 C 32.3 76.1, 36.0 78.0, 36.6 74.9" />
    <path d="M47.1 52.4 C 48.1 68.2, 44.2 80.1, 42.2 92.9" />
    <path d="M68.3 48.3 C 71.3 60.4, 77.4 66.5, 87.5 66.5 C 93.5 66.5, 93.5 58.4, 87.5 58.4" />
    <path d="M62.2 50.3 C 63.8 59.5, 69.1 65.7, 75.3 70.2 C 79.1 73.2, 76.0 77.9, 72.2 75.6" />
    <path d="M56.2 52.4 C 57.0 64.1, 62.0 72.3, 67.0 80.7 C 69.5 84.8, 64.6 87.4, 63.6 83.2" />
    <path d="M51.1 52.4 C 50.4 63.9, 53.3 72.5, 54.8 81.8" />
