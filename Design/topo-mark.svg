    <path d="M63 50 C 65 62, 72 70, 80 76 C 85 80, 81 86, 76 83" />
    <path d="M57 52 C 58 66, 64 76, 70 86 C 73 91, 67 94, 66 89" />
    <path d="M52 52 C 51 68, 55 80, 57 93" />
